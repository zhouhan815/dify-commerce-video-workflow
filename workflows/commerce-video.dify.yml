      type: custom
      data:
        type: code
        title: 返回成片或可续查状态
        desc: 服务端成功后才显示可用的成片与验收。
        code_language: python3
        code: |
          import json

          def main(body: str, status_code: int, job_id: str, status_url: str, result_page: str) -> dict:
              try:
                  status = json.loads(body or "{}")
              except (TypeError, ValueError):
                  status = {}
              if status_code not in (200, 202) or not isinstance(status, dict) or status.get("job_id") != job_id or not status.get("status"):
                  status = {"status": "status_unavailable", "message": "当前未取到任务状态，可打开任务页继续查看。"}
              render_status = status["status"]
              video_route = f"/media/output/{job_id}.mp4"
              final_url = f"http://127.0.0.1:8795{video_route}"
              video_url = ""
              if render_status == "complete":
                  if status.get("final_video") in (video_route, final_url):
                      video_url = final_url
                  else:
                      render_status = "completion_unverified"
                      status["message"] = "成片地址暂未确认，可打开任务页继续查看。"
              status.update(job_id=job_id, status=render_status, status_url=status_url, result_page=result_page, video_url=video_url)
              return {"render_status": render_status, "video_url": video_url,
                      "video_job_json": json.dumps(status, ensure_ascii=False, separators=(",", ":"))}
