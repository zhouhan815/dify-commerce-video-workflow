              identity = notes.get("face", "") if isinstance(notes, dict) else notes
              if identity:
                  lines.append("全片人物统一为" + _inline_refs(_text(identity), True) + "。")
              elif rows and (creative.get("opening_image_context") == "wardrobe_only"
                             or "人物" in _text(by_label.get(rows[0]["slot"],{}).get("asset_purpose"))):
                  lines.append(f"统一使用{_ref(rows[0]['slot'],True)}中模特的脸、发型和身材。")
