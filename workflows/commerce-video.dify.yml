      data:
        type: code
        title: 模型适配和终检
        desc: 按所选模型编译提示词、素材计划和可送审状态。执行到此仍未调用生成 API。
        code_language: python3
        code: |
          """Compile an evidence-based clip plan into a local provider preview.

          The caller resolves the reference labels to published media after permission and
          material validation. This module does not read files or call a provider.
          """

          from math import ceil, isfinite
          import re


          WAN = "wan3.0-video"
          FLASH = "doubao-seedance-2-5-flash-261115"
          FLASH_FPS = 24
          WAN_FPS = 30
          MODES = {"reference_regenerate", "edit_existing"}
          RATIOS = {"16:9", "9:16", "1:1", "4:3", "3:4", "21:9", "adaptive"}
          ASSET_PREFIX = {"reference_image": "图", "reference_video": "视频"}
          FLASH_INPUT_TYPE = {"reference_image": "image_url", "reference_video": "video_url"}
          LOCAL_ASSET_FIELDS = ("local_path", "bytes", "sha256", "source_sha256", "variant")
          SOURCES = {
              WAN: "https://help.aliyun.com/zh/model-studio/wan3-video-generation-api-reference",
              FLASH: "https://docs.volcengine.com/docs/ark/seedance-2-5?lang=zh",
              "ark_portrait": "https://docs.volcengine.com/docs/ark/seedance-portrait-asset-guide?lang=zh",
          }


          def _text(value):
              return " ".join(str(value or "").split())


          def _outfit(value):
              value = _text(value)
              return value.zfill(2) if value.isdecimal() else value


          def _seconds(value):
              try:
                  seconds = float(value)
              except (TypeError, ValueError):
                  return None
              return seconds if isfinite(seconds) else None


          def _label(value):
              value = re.sub(r"\s+", "", _text(value)).removeprefix("@")
              return value.replace("图片", "图", 1) if value.startswith("图片") else value


          def _ref(label, flash):
              if not flash:
                  return label
              prefix = "图片" + label[1:] if label.startswith("图") else label
              return "@" + prefix


          def _inline_refs(text, flash):
              if not flash:
                  return text
              return re.sub(r"@?(?:图片|图|视频)\s*\d+", lambda match: _ref(_label(match[0]), True), text)


          def _t(seconds):
              return f"{seconds:.3f}"


          def _title_mode(creative):
              if not _text(creative.get("title")):
                  return "none"
              explicit = _text(creative.get("title_mode"))
              if explicit:
                  return explicit
              timing = _text(creative.get("title_timing"))
              return "swipe" if re.search(r"指尖|食指|横扫|手势|挥手", timing) else "static"


          def _title_frame(creative):
              if _title_mode(creative) == "swipe":
                  return "按实际手势在指尖上方预留横排空间，保持无字画面，标题后期合成。"
              return "给后期标题保留干净画面。"


          def _camera_flags(creative):
              direction = _text(creative.get("camera_direction"))
              notes = [_text(v) for v in (creative.get("preserve") or [])] + [direction]
              requested = creative.get("camera_lock")
              locked = (requested in {"fixed","geometry_only"} if requested else
                        any(t.startswith(("固定机位","全程固定机位","全片固定机位","锁定机位")) for t in notes))
              # Older reviewed continuous-shot jobs carry both a source composition survey and
              # an explicit project-wide fixed-camera requirement.
              single = creative.get("single_take")
              if single is None:
                  single = any(t.startswith(("一镜到底","全片一镜到底","全程一镜到底")) for t in notes)
                  single = single or bool(locked and creative.get("wan_reference_composition") and creative.get("wan_staging"))
              return locked, single is True


          def _camera(creative):
              locked,single = _camera_flags(creative)
              cues = [_text(creative.get("camera_direction"))]
              if locked:
                  cues.append("机位、视点与焦距保持固定")
              if single:
                  cues.append("全片一镜到底")
              return (_performance_text(*cues) or "按各时段的画面安排展示人物与衣鞋") + "。"


          def _unbound_source(prompt):
              return re.search(r"@(?:视频|音频)|(?:视频|音频)\s*\d+|母版|(?:按|依|沿用|参照|参考|见)(?:本段|本次|该段)?(?:原片|参考片|原视频)|(?:原片|参考片)(?:中|为准|可见|所示)|以(?:本段|当前|可见)(?:[^。，；\n]{0,12})(?:原片|素材片|参考片|可见帧)(?:为准|为依据)", prompt)


          def _scene_reference(creative, items, errors):
              """Add the actual empty-scene photograph after wardrobe images, outside the outfit timeline."""
              scene = creative.get("scene_reference")
              if scene is None:
                  pack = creative.get("wan_look_board") or creative.get("wan_scene_pack") or {}
                  if isinstance(pack, dict):
                      scene = pack.get("room")
              if scene is None:
                  return items
              if (not isinstance(scene, dict) or not scene.get("local_path") or type(scene.get("bytes")) is not int
                      or scene["bytes"] <= 0 or not re.fullmatch(r"[a-f0-9]{64}", str(scene.get("sha256","")))):
                  errors.append("独立空景须提供可核验的实际文件、字节数和 SHA-256。")
                  return items
              images = [a for a in items if a.get("type") == "reference_image"]
              for image in images:
                  if image.get("sha256") == scene["sha256"]:
                      if image.get("asset_purpose") != "empty_room" or image.get("outfit_id"):
                          errors.append("独立空景不可与款式照片绑定为同一个文件。")
                      return items
              if len(images) >= 10:
                  errors.append(f"本次 {len(images)} 张穿搭图加 1 张独立空景需要 {len(images)+1} 个图片位置，超过此路线的 10 张上限。请选择合图路线或减少独立穿搭张数。")
              return [*items, dict(scene, type="reference_image", label=f"图{len(images)+1}", asset_purpose="empty_room",
                                   description="目标场景的独立空景，提供透视、空间陈设和主光方向。")]


          def _provider_parameters(creative, source_duration, final_timing, flash, editing, errors, warnings):
              ratio = _text(creative.get("ratio")) or "9:16"
              if ratio not in RATIOS:
                  errors.append(f"画幅比例 {ratio} 不在支持的档位内。")
              preserve_audio = creative.get("source_native_audio", True) is True
              generate_audio = creative.get("generate_audio", False) is True and not preserve_audio
              if creative.get("generate_audio") is True and preserve_audio:
                  warnings.append("原音按后期逐包合成，已禁用模型合成音轨。")

              requested_resolution = _text(creative.get("resolution"))
              duration = _seconds(creative.get("duration_s"))
              if duration is None and (final_timing is not None or source_duration is not None):
                  duration = ceil(final_timing if final_timing is not None else source_duration)
              minimum = 4 if flash else 2
              if flash:
                  # Direct edits inherit source length and aspect ratio under the official API.
                  resolution = requested_resolution.lower() or "480p"
                  if resolution not in {"480p", "720p"}:
                      warnings.append(f"Flash 不支持 {resolution} 输出，预览采用 480p。")
                      resolution = "480p"
                  params = {
                      "resolution": resolution,
                      "ratio": "adaptive" if editing else ratio,
                      "duration": -1 if editing else duration,
                      "omni_reference_task_type": "edit" if editing else "reference",
                      "generate_audio": generate_audio,
                      "watermark": False,
                  }
              else:
                  resolution = requested_resolution.upper() or "480P"
                  if resolution not in {"480P", "720P", "1080P"}:
                      errors.append(f"万相 3.0 不支持 {resolution} 输出。")
                  params = {
                      "resolution": resolution,
                      "ratio": ratio,
                      "duration": duration,
                      "audio": generate_audio,
                      "prompt_extend": False,
                      "watermark": False,
                  }
              if params["duration"] != -1:
                  if duration is None or not float(duration).is_integer() or not minimum <= duration <= 30:
                      errors.append(f"生成时长应为 {minimum}–30 秒的整数。")
                  else:
                      params["duration"] = int(duration)
              return params, preserve_audio


          def _asset_mapping(items, source, flash, editing, duration, errors, warnings):
              assets = []
              images = {}
              counts = dict.fromkeys(ASSET_PREFIX, 0)
              duration_sum = 0
              checked_lengths = True
              portrait = []
              for item in items:
                  kind = item.get("type")
                  if kind not in ASSET_PREFIX:
                      errors.append(f"未知素材类型 {_text(kind)}。")
                      continue
                  counts[kind] += 1
                  label = f"{ASSET_PREFIX[kind]}{counts[kind]}"
                  declared_label = _label(item.get("label"))
                  if declared_label != label:
                      errors.append(f"素材按类型在请求中依次编号。预期 {label}，实际 {_text(item.get('label'))}。")
                  value = {"label": label, "type": kind}
                  value["ref"] = _ref(label, flash)
                  value["description"] = _text(item.get("description") or item.get("recipe"))
                  value["asset_purpose"] = _text(item.get("asset_purpose") or item.get("role"))
                  value.update({key: item[key] for key in LOCAL_ASSET_FIELDS if key in item})
                  value["transmission_status"] = "local_only"
                  if kind == "reference_image":
                      outfit = _outfit(item.get("outfit_id"))
                      if outfit:
                          value["outfit_id"] = outfit
                      images[label] = value
                  else:
                      seconds = _seconds(item.get("duration_s"))
                      if seconds is None and label == "视频1":
                          seconds = _seconds(source.get("duration_s"))
                      low, high = (4 if editing else 2, 30) if flash else (1, 15)
                      if seconds is None:
                          checked_lengths = False
                          errors.append(f"{label} 缺少已测量时长。")
                      else:
                          value["duration_s"] = seconds
                          duration_sum += seconds
                          if not low <= seconds <= high:
                              errors.append(f"{label} 时长 {seconds:g} 秒超出 {low}–{high} 秒。")
                  if flash:
                      value["role"] = kind
                      value["content_type"] = FLASH_INPUT_TYPE[kind]
                      is_source = label == "视频1"
                      has_real_face = item.get("has_real_face")
                      if is_source and source.get("has_real_face") is True:
                          has_real_face = True
                      elif is_source and has_real_face is None:
                          has_real_face = source.get("has_real_face")
                      approved = (
                          source.get("approved_ark_asset", item.get("approved_ark_asset"))
                          if is_source else item.get("approved_ark_asset")
                      )
                      if is_source and has_real_face is None:
                          warnings.append("视频1 的真实人脸状态需以素材审核结果为准。")
                      if has_real_face is True and approved is not True:
                          value["input_requirement"] = "approved_ark_portrait_asset_required"
                          portrait.append(label)
                      elif has_real_face is True:
                          value["input_requirement"] = "approved_ark_portrait_asset"
                      else:
                          value["input_requirement"] = "provider_accepted_media"
                  assets.append(value)

              if counts["reference_image"] > 10 or counts["reference_video"] > 5:
                  errors.append("参考素材超过 10 张图片或 5 段视频的限制。")
              if not assets:
                  errors.append("参考重制或视频编辑需要至少一项参考素材。")
              if editing and not counts["reference_video"]:
                  errors.append("编辑原片需要绑定 视频1。")
              input_limit = 30 if flash else 15
              if checked_lengths and duration_sum > input_limit:
                  errors.append(f"参考视频总时长 {duration_sum:g} 秒超过 {input_limit} 秒。")
              if not flash and counts["reference_video"] and duration is not None and duration_sum + duration > 30:
                  errors.append("万相 3.0 输入视频总时长与输出时长之和不能超过 30 秒。")
              if portrait:
                  errors.append("方舟真人肖像素材需由官方认可入口提供。待核对：" + "、".join(portrait) + "。")
              return assets, images, portrait


          def _performance_text(*values):
              """Join independent acting instructions, removing duplicate sentences within one cue."""
              sentences = (part.strip(" 。；，、") for value in values for part in _text(value).split("。"))
              return "。".join(dict.fromkeys(part for part in sentences if part))


          _EVIDENCE_FRAME = re.compile(
              r"(?<![A-Za-z0-9_])(?:F\s*\d+|第\s*\d+\s*帧|frames?\s+\d+)"
              r"(?:\s*[-–—~～至到]\s*(?:F\s*|第\s*|frames?\s+)?\d+\s*帧?)?(?![A-Za-z0-9_])", re.I)
          _INTERNAL_ACTION = re.compile(
              r"(?:舌(?:尖|头|根|面)?(?:轻轻|轻微|稍稍|轻|微)?(?:触及|触碰|触|抵住?|顶住?|贴住?|压住?|靠近)"
              r"(?:在|于|向)?(?:上|下)?(?:齿龈|牙龈|齿背|齿内侧|齿后方?|牙槽脊|硬腭|软腭|上腭|上颚)"
              r"|(?:维持|保持|打开|打通|扩大|控制)(?:口腔内的?|稳定的?)?(?:气息|呼吸|发声)通道(?:的)?(?:畅通|通畅)?"
              r"|(?:声带|横膈膜|膈肌|软腭)(?:轻微|轻轻|缓慢|逐渐|微微)?(?:振动|震动|闭合|收缩|舒张|抬升|上抬|下沉))")


          def _visible_actor_text(value):
              """Project acting notes into visible instructions; the sealed source evidence remains intact."""
              value = _EVIDENCE_FRAME.sub("", _text(value))
              value = re.sub(r"[（(]\s*[）)]", "", value)
              value = re.sub(r"(?:以便|以|从而|并且|并|同时)?"+_INTERNAL_ACTION.pattern, "", value)
              value = re.sub(r"[，、,](?=[，、,；;。→]|$)", "", value)
              return value.strip(" ，、,；;。")


          def _provider_acting_rows(rows, errors):
              fields = ("action", "face", "fabric", "brief", "cue", "actor_cue", "body_amplitude")
              for row in rows:
                  for field in fields:
                      if field in row:
                          row[field] = _visible_actor_text(row[field])
                  if isinstance(row.get("affect"), dict):
                      row["affect"] = dict(row["affect"], label=_visible_actor_text(row["affect"].get("label")))
                  for phase in row.get("phases", []):
                      for field in ("brief", "action", "face"):
                          if field in phase:
                              phase[field] = _visible_actor_text(phase[field])
                      if not any(phase.get(field) for field in ("brief", "action", "face")):
                          errors.append(f"{row['section']} 的表演锚点缺少可见动作，请复核原帧。")
                  if not row.get("action"):
                      errors.append(f"{row['section']} 缺少可执行的外部动作，请复核原片。")


          def _performance_controls(primary, fallback):
              acting = primary.get("acting_read") or fallback.get("acting_read") or {}
              return {
                  "brief": _text(primary.get("brief") or fallback.get("brief")),
                  "cue": _text(primary.get("cue") or fallback.get("cue")),
                  "actor_cue": _text(acting.get("actor_cue")) if isinstance(acting, dict) else "",
              }


          def _timed_performance(row):
              on_frame = {}
              for phase in row.get("phases", []):
                  on_frame.setdefault(phase["target_s"], []).extend(phase.get(k) for k in ("brief", "action", "face"))
              return "；".join(f"{_t(t)}秒，{_performance_text(*words)}" for t, words in on_frame.items())


          def _segment_performance(row, *values):
              """Keep the timestamped copy when the same instruction also occurs in the summary."""
              anchored = {part for phase in row.get("phases", [])
                          for key in ("brief", "action", "face")
                          for part in _performance_text(phase.get(key)).split("。") if part}
              return "。".join(part for part in _performance_text(*values).split("。") if part and part not in anchored)


          def _direction(row):
              """Prefer verified target direction, keeping source observations as evidence."""
              reviewed = row.get("direction") or {}
              result = {field: _text(reviewed.get(field, row.get(field))) for field in ("action", "face", "fabric")}
              affect = reviewed.get("affect") or row.get("affect")
              if isinstance(affect, dict) and affect.get("label") and affect.get("intensity"):
                  result["face"] += f"。呈现{_text(affect['label'])}，表演力度{affect['intensity']}/5"
              elif isinstance(affect, str) and affect.strip():
                  result["face"] += "。呈现" + _text(affect)
              detail = reviewed.get("image_only") or {}
              result.update(_performance_controls(reviewed, detail if isinstance(detail, dict) else {}))
              return result


          def _timeline(rows, images, source_duration, use_source, errors, warnings, reference_phases=False):
              entries = []
              prior_end = 0
              cropped = False
              used_target_timing = False
              for index, row in enumerate(rows, 1):
                  start = _seconds(row.get("source_start_s")) if use_source else None
                  end = _seconds(row.get("source_end_s")) if use_source else None
                  if use_source and (start is None or end is None):
                      used_target_timing = True
                  start = _seconds(row.get("start_s")) if start is None else start
                  end = _seconds(row.get("end_s")) if end is None else end
                  if use_source and end is not None and source_duration is not None and end > source_duration:
                      end, cropped = source_duration, True
                  if start is None or end is None or start < 0 or end <= start:
                      errors.append(f"第 {index} 行缺少有效起止秒。")
                      continue
                  if round(start, 3) != round(prior_end, 3):
                      errors.append(f"第 {index} 行 {_t(start)} 秒与上一段末尾 {_t(prior_end)} 秒不连续。")
                  prior_end = end
                  slot = _label(row.get("slot"))
                  if slot and slot not in images:
                      errors.append(f"第 {index} 行引用了未绑定的 {slot}。")
                  garment = _outfit(row.get("outfit_id"))
                  linked = images.get(slot, {}).get("outfit_id")
                  if linked and garment and linked != garment:
                      errors.append(f"第 {index} 行 {slot} 绑定的服装号 {linked} 与时间表 {garment} 不一致。")
                  if garment and not slot:
                      errors.append(f"第 {index} 行服装号 {garment} 缺少对应图片。")
                  direction = _direction(row)
                  if reference_phases:
                      directed = row.get("direction") or {}
                      detail = directed.get("image_only") or {}
                      phases = directed.get("phases") or (detail.get("phases") if isinstance(detail, dict) else []) or []
                      bounds = row.get("source_frames") or []
                      if phases and (len(bounds) != 2 or not all(type(f) is int for f in bounds) or bounds[1] < bounds[0]):
                          errors.append(f"第 {index} 行逐帧表演缺少有效原帧区间。")
                          continue
                      direction["phases"] = []
                      prev = -1
                      for phase in phases:
                          frame = phase.get("source_frame") if isinstance(phase, dict) else None
                          if type(frame) is not int or not bounds[0] <= frame <= bounds[1] or frame <= prev:
                              errors.append(f"第 {index} 行表演锚点须按原帧区间递增。")
                              break
                          if not any(_text(phase.get(k)) for k in ("brief", "action", "face")):
                              errors.append(f"第 {index} 行第 {frame} 帧缺少表演内容。")
                              break
                          # Source-clock edits keep the original phase offset; target-clock remakes
                          # proportionally map that same phase into the directed segment.
                          fraction = (frame - bounds[0]) / (bounds[1] - bounds[0] + 1)
                          direction["phases"].append({**phase, "target_s": round(start + fraction * (end - start), 6)})
                          prev = frame
                  if not direction["action"]:
                      errors.append(f"第 {index} 行缺少动作描述。")
                  entries.append({
                      "start_s": start, "end_s": end, "slot": slot, "outfit_id": garment or linked,
                      "section": _text(row.get("section")), "beat": _text(row.get("beat")), **direction,
                  })
              if not entries:
                  errors.append("至少需要一段有明确起止秒的时间表。")
              if cropped:
                  warnings.append("原片末尾前的最后一段保持已按原片结束时间收束。")
              if used_target_timing:
                  warnings.append("部分段缺少原片时间，预览采用该行原有时间，提交前应补齐原片切点。")
              return entries


          def _changes(rows):
              return [
                  row for index, row in enumerate(rows)
                  if index and row["slot"] and row["slot"] != rows[index - 1]["slot"]
              ]


          def _images_only_timeline(analysis, images, duration, errors, warnings, fps=FLASH_FPS):
              """Map measured music pulses and reviewed source poses to the provider output grid."""
              original = analysis.get("timeline") or []
              source = analysis.get("source") or {}
              rows = _timeline(original, images, _seconds(source.get("duration_s")), True, errors, warnings)
              cuts = analysis.get("cuts") or []
              changes = _changes(rows)
              if len(rows) != len(original) or not rows:
                  return []
              if [row["slot"] for row in [rows[0], *changes]] != list(images):
                  errors.append("图片顺序需要与开场及每个换装区间一一对应。")
              if len(changes) != len(cuts):
                  errors.append("实际换装次数与核验切点数量不符。")
                  return []
              source_fps = _seconds(source.get("fps"))
              if not source_fps or source_fps <= 0 or not duration or duration <= 0:
                  errors.append("图片生成缺少有效的原片帧率或目标总时长。")
                  return []
              ceiling = analysis["creative"].get("performance_intensity_ceiling", 3)
              source_cuts = analysis["creative"].get("timing_mode") == "source_cuts"
              for row, cut in zip(changes, cuts):
                  entrance = _seconds(cut.get("source_s" if source_cuts else "pulse_s"))
                  if source_cuts and type(cut.get("source_frame")) is int:
                      from_frame = cut["source_frame"] / source_fps
                      if entrance is not None and abs(entrance - from_frame) > .5 / source_fps:
                          errors.append(f"{row['section']} 的首帧编号和首帧时刻不一致。")
                      entrance = from_frame
                  if entrance is None or entrance < 0 or entrance >= duration:
                      errors.append(f"{row['section']} 缺少有效的{'换装首帧时刻' if source_cuts else '音乐拍点'}。")
                      return []
                  if (row["slot"], row["outfit_id"], row["beat"]) != (
                      _label(cut.get("slot")), _outfit(cut.get("outfit_id")), _text(cut.get("beat"))
                  ):
                      errors.append(f"{row['section']} 的拍点与款式槽位不匹配。")
                  row["entrance_s"] = entrance
                  if not source_cuts:
                      row["pulse_s"] = entrance

              # An outfit can span multiple opening actions. Place its entrance on its
              # beat; intermediate movements keep their original offset from that entrance.
              for row in rows:
                  if row is rows[0] or "entrance_s" in row:
                      source_entrance = row["start_s"]
                      target_entrance = ceil(row.get("entrance_s", 0) * fps - 1e-7)
                  row["start_frame"] = target_entrance + round((row["start_s"] - source_entrance) * fps)
              ends = [row["start_frame"] for row in rows[1:]] + [round(duration * fps)]
              fallback = []
              for raw, row, end in zip(original, rows, ends):
                  section = row["section"]
                  start = row["start_frame"]
                  if end <= start:
                      errors.append(f"{section} 在输出帧网格上没有可见时长。")
                      return []
                  row.update(start_s=start / fps, end_s=end / fps, end_frame_exclusive=end)
                  directed = raw.get("direction") or {}
                  detail = directed.get("image_only") or {}
                  if not isinstance(detail, dict):
                      errors.append(f"{section} 图片路线的表演复核记录格式无效。")
                      return []
                  for field in ("action", "face", "fabric"):
                      row[field] = _text(detail.get(field) or directed.get(field))
                  if detail.get("amplitude") or directed.get("amplitude"):
                      row["body_amplitude"] = _text(detail.get("amplitude") or directed.get("amplitude"))
                  row["affect"] = detail.get("affect") or directed.get("affect") or {}
                  intensity = row["affect"].get("intensity") if isinstance(row["affect"], dict) else None
                  if type(intensity) is not int or not 1 <= intensity <= ceiling or not _text(row["affect"].get("label")):
                      errors.append(f"{section} 缺少已核对的表情观感或超出表演力度上限。")
                  row.update(_performance_controls(detail, directed))
                  if not (row["cue"] or row["actor_cue"]) and not (row["action"] and row["face"]):
                      errors.append(f"{section} 缺少能独立执行的身体动作或面部表演。")
                  frames = raw.get("source_frames") or []
                  row["source_frames"] = frames
                  row["phases"] = []
                  previous = -1
                  phases = detail.get("phases") or []
                  if not isinstance(phases, list):
                      errors.append(f"{section} 表演锚点须为逐帧列表。")
                      return []
                  if len(phases) < 2 and not (row["cue"] or row["brief"] or row["actor_cue"]):
                      fallback.append(section)
                  for phase in phases:
                      frame = phase.get("source_frame") if isinstance(phase, dict) else None
                      if (type(frame) is not int or len(frames) != 2 or not frames[0] <= frame <= frames[1]
                              or frame <= previous):
                          errors.append(f"{section} 表演锚点须在对应原片帧区间内严格递增。")
                          break
                      action, face = _text(phase.get("action")), _text(phase.get("face"))
                      if not action and not face:
                          errors.append(f"{section} 的第 {frame} 帧缺少可观察动作。")
                      target = min(end - 1, start + round((frame - frames[0]) * fps / source_fps))
                      row["phases"].append(dict(phase, source_frame=frame, target_frame=target, target_s=target / fps,
                                                action=action, face=face, prompt=phase.get("prompt") is True,
                                                brief=_text(phase.get("brief"))))
                      previous = frame
              if fallback:
                  errors.append("仅图路线缺少已复核的拍内动作与表情过程（完整 cue 或至少两个表演锚点）：" + "、".join(fallback))
              return rows


          def _flash_images_prompt(creative, rows):
              lines = [_camera(creative) + "左右按画面，时码为秒。"]
              notes = creative.get("model_notes") or {}
              identity = notes.get("face") if isinstance(notes, dict) else notes
              scene_cue = creative.get("flash_images_only_scene_cue") or (
                  None if creative.get("wan_look_board") else creative.get("images_only_scene_cue"))
              if scene_cue:
                  lines.append(_inline_refs(_text(scene_cue), True).rstrip("。") + "。")
              else:
                  for description in (identity, creative.get("scene"), creative.get("lighting")):
                      if description:
                          lines.append(_inline_refs(_text(description), True).rstrip("。") + "。")
                  if rows:
                      opening = _ref(rows[0]["slot"], True)
                      role = "人物与开场全套衣鞋" if creative.get("opening_image_context") == "wardrobe_only" else "人物、首套衣鞋与场景尺度"
                      lines.append(f"{opening}确定{role}。")
              if creative.get("opening_closed_mouth") is True:
                  lines.append("开场双唇自然闭合。")
              if creative.get("opening_action"):
                  lines.append(_text(creative["opening_action"]))
              if creative.get("title"):
                  lines.append(_title_frame(creative))
              levels = [r["affect"].get("intensity") for r in rows if isinstance(r.get("affect"), dict)]
              typical = max(levels, key=levels.count) if levels else None
              if typical:
                  lines.append(f"表演常态{typical}/5，5最强。")
              if _changes(rows):
                  lines.append("每张穿搭图提供对应款的整套衣鞋配件，新款在给定时刻换入。")
              elif rows:
                  lines.append(f"全程一款，穿{_ref(rows[0]['slot'],True)}的完整衣鞋。")
              lines.append("衣料随动作受力形成和放松浅褶。")
              previous = None
              for row in rows:
                  slot = row["slot"]
                  header = f"{row['start_s']:.3f}".rstrip("0").rstrip(".") + (f" {_ref(slot, True)}" if slot != previous else "")
                  affect = row["affect"] if isinstance(row.get("affect"), dict) else {}
                  cue = _performance_text(row["brief"], row["cue"], row["actor_cue"])
                  if not row["phases"]:
                      cue = _performance_text(cue, row["action"], row["face"])
                  cue = _segment_performance(row, cue, affect.get("label"))
                  if affect.get("intensity") and affect["intensity"] != typical:
                      cue = f"{cue.rstrip('。')}（{affect['intensity']}/5）"
                  line = header + " " + cue.rstrip("。；，、 ")
                  if row["phases"]:
                      line += "；" + _timed_performance(row)
                  lines.append(line.rstrip("。； ") + "。")
                  previous = slot
              return "\n".join(lines)


          def _wan_staging(creative, images, rows, errors):
              """Bind a measured full-length end mark to the actual first image."""
              if "wan_staging" not in creative:
                  return None
              stage = creative["wan_staging"]
              if not isinstance(stage, dict) or not rows or not images:
                  errors.append("万相固定机位校准需要同场图和连续的表演时间轴。")
                  return None
              anchor = images.get(rows[0]["slot"]) or {}
              if (not anchor.get("sha256") or stage.get("anchor_sha256") != anchor["sha256"]
                      or stage.get("anchor_label") != anchor.get("label")):
                  errors.append("退定站位标定与本次实际送入的开场同场图不一致。")
                  return None
              keys = ("x_center", "head_y", "shoe_y", "retreat_end_s", "static_from_s")
              x, head, shoe, retreat, lock = (_seconds(stage.get(key)) for key in keys)
              if (None in (x, head, shoe, retreat, lock) or not 0 < x < 1
                      or not 0 <= head < shoe <= 1 or not rows[0]["start_s"] <= retreat <= lock < rows[-1]["end_s"]):
                  errors.append("同场图身高标定或退步、定点时间无效。")
                  return None
              if "retreat_translation" in stage:
                  step = stage["retreat_translation"]
                  fields = ("start_s", "end_s", "toe_advance_h", "hip_advance_h", "reference_person_height")
                  if not isinstance(step, dict):
                      errors.append("末步位移标定必须包含起止时刻、移动脚和原片实测量。")
                      return None
                  a, b, toe, hip, ref_h = (_seconds(step.get(k)) for k in fields)
                  if (None in (a, b, toe, hip, ref_h) or not rows[0]["start_s"] <= a < b <= retreat
                          or step.get("moving_foot") not in {"画面左脚", "画面右脚"}
                          or not (0 < toe < ref_h <= 1 and 0 < hip < ref_h)):
                      errors.append("末步位移需要有效的向远端落点和骨盆位移，且须在退定前完成。")
                      return None
                  stage = {**stage, "retreat_translation": {**step, **dict(zip(fields, (a, b, toe, hip, ref_h)))}}
                  if "support_toe_advance_h" in step:
                      support = _seconds(step["support_toe_advance_h"])
                      if support is None or abs(support) >= ref_h:
                          errors.append("支撑脚的有符号相对位移超出画面范围。")
                          return None
                      stage["retreat_translation"]["support_toe_advance_h"] = support
              return {**stage, "enabled": True, "x_center": x, "head_y": head, "shoe_y": shoe,
                      "retreat_end_s": retreat, "static_from_s": lock, "person_height": round(shoe - head, 4)}


          def _wan_images_prompt(creative, images, rows, changes, staging=None):
              """Render the full reviewed acting sequence using Wan's numbered images and seconds."""
              if not rows:
                  return ""
              opening = rows[0]["slot"]
              opening_role = "人物及首套衣鞋" if creative.get("opening_image_context") == "wardrobe_only" else "人物、第一套衣鞋与场景尺度"
              lines = [
                  _camera(creative) + "左右按画面方向，以下时间均从开场零秒起算。",
                  f"{opening}确定{opening_role}。全片保持这位模特的脸与头身比例。",
              ]
              for value in (creative.get("scene"), creative.get("lighting")):
                  if value:
                      lines.append(_text(value).rstrip("。") + "。")
              if staging:
                  lines.extend(_standing_directions(staging))
                  step = staging.get("retreat_translation")
                  if step:
                      scale = staging["person_height"] / step["reference_person_height"]
                      lines.append(f"{_t(step['start_s'])}–{_t(step['end_s'])}秒才完成最后一步。"
                                   f"{step['moving_foot']}起初靠近镜头，另一鞋踩住同一块地板。"
                                   "移动脚踏上更远的新落点并接过体重，骨盆随这一步移动。"
                                   f"以固定地板为参照，移动脚尖的落点向画面上方移约{step['toe_advance_h']*scale:.0%}画高，"
                                   f"骨盆约{step['hip_advance_h']*scale:.0%}。")
              if creative.get("opening_action"):
                  lines.append(_text(creative["opening_action"]))
              if creative.get("opening_closed_mouth") is True:
                  lines.append("开场双唇自然闭合。")
              if creative.get("title"):
                  lines.append(_title_frame(creative))
              if changes:
                  lines.append(f"零秒至{_t(changes[0]['start_s'])}秒持续穿开场装。随后只在以下{len(changes)}个标明换装的时刻瞬间换整套，"
                               "同一款期间衣服保持，姿态和重心位置按时间表演绎。")
              else:
                  lines.append(f"全程一款，穿{opening}的完整衣鞋。")
              lines.append("每张图提供该套的衣裤裙、鞋袜与配饰。面料在肘膝弯曲处挤出少量浅褶，伸展时放松；头发与衣摆随身体略滞后再落定。")
              for label, image in images.items():
                  if image["description"]:
                      lines.append(f"{label}，{image['description'].rstrip('。')}。")

              previous = None
              for row in rows:
                  switch = previous is not None and previous != row["slot"]
                  wardrobe = "瞬换" + row["slot"] if switch else "穿" + (row["slot"] or "")
                  affect = row["affect"] if isinstance(row.get("affect"), dict) else {}
                  feeling = str(affect.get("label") or "")
                  if affect.get("intensity"):
                      feeling += f"，力度{affect['intensity']}/5"
                  direction = _performance_text(row.get("brief"), row.get("cue"), row.get("actor_cue"))
                  if not direction or not row["phases"]:
                      direction = _performance_text(direction, row["action"], row["face"])
                  lines.append(f"{_t(row['start_s'])}–{_t(row['end_s'])}秒，{wardrobe}。{_segment_performance(row, direction, feeling)}。")
                  if row["phases"]:
                      lines.append(_timed_performance(row) + "。")
                  previous = row["slot"]
              return re.sub(r"@?(?:图片|图)\s*(\d+)", r"图\1", "\n".join(lines))


          def _flash_edit_prompt(creative, assets, rows):
              """Scope an edit to a single parent. Bind each look once on the source clock."""
              by_label = {asset["label"]:asset for asset in assets}
              lines = ["编辑 @视频1，作为唯一母版。保留原片时长、走位、动作先后、遮挡和原有节奏。"]
              if creative.get("camera_direction") or any(_camera_flags(creative)):
