          def main(evidence_json: str, target_model: str, output_mode: str) -> dict:
              if not isinstance(evidence_json, str) or not evidence_json or len(evidence_json) > 200000:
                  raise ValueError("证据包须是非空 JSON 字符串，不超过 200,000 字符。")
              if target_model not in ("Wan 3.0", "Seedance 2.5 Flash"):
                  raise ValueError("请选择 Wan 3.0 或 Seedance 2.5 Flash。")
              if output_mode not in ("analysis_json", "report"):
                  raise ValueError("未知的输出模式。")
              packet = json.loads(evidence_json)
              if not isinstance(packet, dict) or not {"source", "assets", "timeline", "creative"} <= packet.keys():
