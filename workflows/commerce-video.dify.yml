          """Checks shared by local prompt compilation and Dify Code nodes."""

          import hashlib
          import json
          import math
          import re


          def demand(condition, message):
              if not condition:
                  raise ValueError(message)


          def number(value, field):
              demand(type(value) in (int, float) and math.isfinite(value), f"{field} 必须是有效数字")
              return value


          def validate_media_bindings(analysis):
              demand(analysis["schema_version"] == "marketing-prompt-evidence/1.0", "证据版本不匹配")
              source = analysis["source"]
              demand(re.fullmatch(r"[0-9a-f]{64}", source["sha256"]), "原片缺少可核对的文件校验值")
              demand(number(source["fps"], "原片帧率") > 0 and number(source["duration_s"], "原片时长") > 0,
                     "原片规格无效")
              demand(source["frame_count"] > 0 and type(source["has_real_face"]) is bool, "原片帧数或人脸状态无效")
              assets = analysis["assets"]
              images = [item for item in assets if item["type"] == "reference_image"]
              videos = [item for item in assets if item["type"] == "reference_video"]
              demand(len(videos) == 1 and videos[0]["label"] == "视频1", "只绑定一份编辑母版或动作视频")
              demand(videos[0]["source_sha256"] == source["sha256"], "参考视频与原片的来源关联不一致")
              demand(videos[0]["variant"] in {"original", "silent_derivative"}, "视频职责版本无效")
              if videos[0]["variant"] == "original":
                  demand(videos[0]["sha256"] == source["sha256"], "标为原片的文件内容有变化")
              demand(images and len(images) <= 10, "当前模型路线需要 1 至 10 张对应商品图")
              demand(len(images) + len(videos) == len(assets), "混入未绑定职责的送模材料")
              demand(len({item["sha256"] for item in assets}) == len(assets), "送模素材有重复内容")
              for index, item in enumerate(images, 1):
                  demand(item["label"] == f"图{index}" and bool(item["outfit_id"]) and bool(item["description"]),
                         f"第 {index} 张图的接口槽位或款式未绑定")
              demand(len({item["outfit_id"] for item in images}) == len(images), "同一款式重复占用图槽")
              for item in assets:
                  demand(re.fullmatch(r"[0-9a-f]{64}", item["sha256"]) and item["bytes"] > 0 and bool(item["local_path"]),
                         f"{item['label']} 缺实际文件清单")
              return analysis


          def validate_timing(analysis):
              source = analysis["source"]
              fps = number(source["fps"], "原片帧率")
              cuts = analysis["cuts"]
              demand(len(cuts) == len(analysis["assets"]) - 2, "切点、首套和逐款图片数量无法一一对应")
              demand(bool(analysis["provenance"]["cut_detector"]) and bool(analysis["provenance"].get("beat_detector")), "缺少画面切点或音乐拍点来源")
              previous_source_frame = previous_target_frame = 0
              previous_beat_time = 0.0
              mode = analysis["creative"].get("timing_mode","beat_locked")
              demand(mode in {"source_cuts","beat_locked"}, "切点计时模式无效")
              for cut, image in zip(cuts, [item for item in analysis["assets"] if item["type"] == "reference_image"][1:]):
                  frame, target = cut["source_frame"], cut["target_frame"]
                  demand(type(frame) is int and previous_source_frame < frame < source["frame_count"],
                         f"{cut['beat']} 的换装首帧无效")
                  demand(type(target) is int and previous_target_frame < target, f"{cut['beat']} 的目标帧无效")
                  demand(abs(number(cut["source_s"], "原片切点") - frame / fps) <= 0.002,
                         f"{cut['beat']} 原片秒数与帧号冲突")
                  demand(abs(number(cut["target_s"], "目标切点") - target / fps) <= 0.0006,
                         f"{cut['beat']} 目标秒数与帧号冲突")
                  pulse = cut.get("pulse_s")
                  if mode == "source_cuts":
                      demand(pulse is None and target == frame, f"{cut['beat']} 视觉换装应保留原片实测帧，不能冒充音频拍点")
                  else:
                      demand(number(pulse, "音频拍点") > previous_beat_time, f"{cut['beat']} 的音乐拍点逆序")
                      demand(target == math.ceil(pulse * fps), f"{cut['beat']} 目标换装必须落在拍上或拍后的第一个画面帧")
                      previous_beat_time = pulse
                  demand((cut["slot"], cut["outfit_id"]) == (image["label"], image["outfit_id"]),
                         f"{cut['beat']} 的服装号与图片槽位冲突")
                  previous_source_frame, previous_target_frame = frame, target
              demand(len({cut["beat"] for cut in cuts}) == len(cuts), "音乐或切点编号重复")
              return analysis


          def _performance_digest(analysis, method, evidence_id):
              # Ignore file relocation and provider options. A reviewed cue may only travel
              # with the same footage, ordered products, creative intent and timed performance.
              creative = analysis["creative"]
              policy = {key: creative.get(key) for key in
                        ("opening_closed_mouth", "opening_action", "model_notes", "scene", "lighting",
                         "title", "title_timing", "preserve")}
              if "performance_intensity_ceiling" in creative:
                  policy["performance_intensity_ceiling"] = creative["performance_intensity_ceiling"]
              if "images_only_scene_cue" in creative:
                  policy["images_only_scene_cue"] = creative["images_only_scene_cue"]
              for key in ("timing_mode","opening_image_context"):
                  if key in creative:
                      policy[key] = creative[key]
              if "scene_reference" in creative:
                  policy["scene_reference_sha256"] = creative["scene_reference"]["sha256"]
              if "wan_staging" in creative:
                  policy["wan_staging"] = creative["wan_staging"]
              if "wan_look_board" in creative:
                  board = creative["wan_look_board"]
                  policy["wan_look_board"] = {
                      "geometry": [board.get("rows"), board.get("columns")],
                      "cells": [[c["code"], c["row"], c["column"], c["outfit_id"], c["white_sha256"], c["logical_sha256"]]
                                for c in board["cells"]],
                      "physical_images": sorted((k, v["sha256"]) for k, v in board.items()
                                                if isinstance(v, dict) and "sha256" in v),
                  }
              rows = []
              for row in analysis["timeline"]:
                  cues = {key: row.get(key) for key in
                          ("section", "source_frames", "slot", "outfit_id", "beat", "action", "face",
                           "left_eye", "right_eye", "amplitude", "fabric", "affect", "direction")}
                  cues["seconds"] = [format(row[key], ".6f") for key in
                                     ("start_s", "end_s", "source_start_s", "source_end_s")]
                  rows.append(cues)
              images = [[a["outfit_id"], a["description"], a["sha256"]] for a in analysis["assets"]
                        if a["type"] == "reference_image"]
              content = [method, evidence_id, analysis["source"]["sha256"], policy, images, rows]
              if "acting_review_version" in analysis["provenance"]:
                  content.append(analysis["provenance"]["acting_review_version"])
              encoded = json.dumps(content, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              return hashlib.sha256(encoded.encode("utf-8")).hexdigest()


          def seal_performance(analysis, method, evidence_id):
              """Record content equality after an evidence review has actually passed upstream."""
              demand(method in {"archived_frame_review", "measured_and_reviewed"} and isinstance(evidence_id, str)
                     and evidence_id.strip(), "缺少表演逐帧复核来源")
              analysis["provenance"]["performance_approval"] = {
                  "method": method, "evidence_id": evidence_id,
                  "sha256": _performance_digest(analysis, method, evidence_id),
              }
              return analysis


          def validate_performance(analysis):
              timeline, source = analysis["timeline"], analysis["source"]
              images = [item for item in analysis["assets"] if item["type"] == "reference_image"]
              scope = analysis["creative"]
              ceiling = scope.get("performance_intensity_ceiling", 3)
              demand(type(ceiling) is int and 1 <= ceiling <= 5, "表演力度上限须在 1 到 5 之间")
              provenance = analysis["provenance"]
              demand(provenance["visual_source_sha256"] == source["sha256"], "动作记录属于另一版原片")
              demand(provenance["visual_runs"] and all(run.get("request_id") and run.get("finish") == "stop"
                                                      for run in provenance["visual_runs"]),
                     "视觉模型分析回包缺失或截断")
              demand(timeline and bool(scope["lighting"]), "缺少连续表演时间轴或受光计划")
              last_target = last_source = 0.0
              transitions = []
              previous_slot = None
              for row in timeline:
                  label = row["section"]
                  direction = row.get("direction")
                  demand(isinstance(direction, dict) and all(isinstance(direction.get(k),str) and direction[k].strip() for k in ("action","face","fabric")),
                         f"{label} 须独立保存可用于成片的身体、脸部和衣料方向")
                  affect = direction.get("affect") or {}
                  demand(isinstance(affect, dict) and isinstance(affect.get("label"), str) and affect["label"].strip()
                         and type(affect.get("intensity")) is int and 1 <= affect["intensity"] <= ceiling,
                         f"{label} 缺少可见表情观感或力度超过本片上限")
                  if provenance.get("acting_review_version") == 1:
                      acting = (direction.get("image_only") or {}).get("acting_read") or {}
                      demand(isinstance(acting, dict) and all(isinstance(acting.get(k), str) and acting[k].strip()
                             for k in ("visible_basis", "actor_cue", "uncertainty")),
                             f"{label} 缺少可见依据、可执行的导演指导或观察局限")
                  start, end = (number(row[k], k) for k in ("start_s", "end_s"))
                  origin, source_end = (number(row[k], k) for k in ("source_start_s", "source_end_s"))
                  demand(abs(start - last_target) <= 0.0006 and end > start, f"{label} 目标时间轴有重叠或缺段")
                  demand(abs(origin - last_source) <= 0.0006 and source_end > origin, f"{label} 原片时间轴有断点")
                  for name in ("action", "face", "fabric", "left_eye", "right_eye", "amplitude"):
                      demand(isinstance(row[name], str) and row[name].strip(), f"{label} 缺少 {name}")
                  if row["slot"] != previous_slot:
                      transitions.append((row["slot"], row["outfit_id"], row["beat"], start, origin))
                  previous_slot, last_target, last_source = row["slot"], end, source_end
              first = images[0]
              expected = [(first["label"], first["outfit_id"], "opening", 0.0, 0.0)]
              expected.extend((item["slot"], item["outfit_id"], item["beat"], item["target_s"], item["source_s"])
                              for item in analysis["cuts"])
              demand(len(transitions) == len(expected), "时间轴丢款、多款或片中重复换款")
              for actual, planned in zip(transitions, expected):
                  demand(actual[:3] == planned[:3] and all(abs(a - b) <= 0.0006 for a, b in zip(actual[3:], planned[3:])),
                         "时间轴的款式、图片或换装秒数与节拍表冲突")
              demand(abs(last_source - source["duration_s"]) <= 0.0006, "原片末态未覆盖")
              demand(abs(last_target - scope["duration_s"]) <= 0.0006, "目标末态未覆盖")
              review = provenance.get("performance_approval") or {}
              method, evidence_id = review.get("method"), review.get("evidence_id")
              demand(method in {"archived_frame_review", "measured_and_reviewed"} and
                     isinstance(evidence_id, str) and bool(evidence_id.strip()),
                     "缺少逐段表演语义复核记录。请从参考片分析入口复核后重新编译")
              demand(review.get("sha256") == _performance_digest(analysis, method, evidence_id),
                     "表演或素材已在逐帧复核后改动，请重新核对原片、两眼、口型与目标款式")
              return analysis


          def validate_prompt_evidence(analysis):
              """Validate roles, timing, and model evidence before adapting the prompt."""
              validate_media_bindings(analysis)
              validate_timing(analysis)
              return validate_performance(analysis)

          import json

          def main(evidence_json: str) -> dict:
              packet = json.loads(evidence_json)
              timeline = packet["timeline"]
              if not isinstance(timeline, (dict, list)) or not timeline:
                  raise ValueError("本次编译需提供至少一个已经分析的时段。")
              validate_timing(packet)
              raw_time = packet["source"].get("duration_s")
              if not isinstance(raw_time, (int, float)) or isinstance(raw_time, bool) or raw_time <= 0:
                  raise ValueError("原片时长必须为正数。")
              return {"source_duration_s": float(raw_time)}
