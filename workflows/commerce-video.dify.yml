    - id: '1795109610015'
      type: custom
      data:
        type: code
        title: 绑定参考片和开场场景图
        desc: 记录参考片来路、服装顺序以及开场图。
        code_language: python3
        code: |
          import json
          import uuid

          def main(asset_mode: str, target_model: str, materials_manifest_json: str, case_id: str = "",
                   reference_video_path: str = "", scene_anchor_source: str = "project_default",
                   scene_anchor_path: str = "", outfit_order: str = "", first_tryon_contains_scene: str = "no", project_options_json: str = "", reuse_only: str = "no",
                   stage_run_directory: str = "", empty_plate_path: str = "", wan_mode: str = "", project_title: str = "",
                   title_mode: str = "", timing_mode: str = "", seedance_mode: str = "", camera_mode: str = "",
                   library_name: str = "") -> dict:
              manifest = json.loads(materials_manifest_json)
              if asset_mode != "ready_evidence":
                  if not manifest.get("tryon_images"):
                      raise ValueError("需要至少一张成功的同一模特试穿图。")
                  if manifest.get("issues"):
                      raise ValueError("试穿素材不完整，请先补齐缺项或选择仅输出素材。")
                  if scene_anchor_source == "provided":
                      if (scene_anchor_path or "").strip():
                          manifest["scene_anchor"] = scene_anchor_path.strip()
                  elif scene_anchor_source == "first_tryon":
                      if first_tryon_contains_scene != "yes":
                          raise ValueError("首套试穿必须含已确认的目标场景，白底照片请另附场景融合图。")
                      manifest["scene_anchor"] = manifest["tryon_images"][0]
                  elif scene_anchor_source not in ("project_default", "auto", ""):
                      raise ValueError("未知的开场参考图来源。")
                  manifest["scene_anchor_source"] = scene_anchor_source
                  manifest["first_tryon_contains_scene"] = first_tryon_contains_scene == "yes"
                  if (empty_plate_path or "").strip():
                      manifest["empty_plate"] = empty_plate_path.strip()
              target = {"Wan 3.0": "wan3.0-video", "Seedance 2.5 Flash": "doubao-seedance-2-5-flash-261115"}[target_model]
              options = json.loads(project_options_json or "{}")
              accepted = {"creative", "outfit_descriptions", "analysis_settings"}
              if not isinstance(options, dict) or not options.keys() <= accepted or not all(isinstance(value, dict) for value in options.values()):
                  raise ValueError("项目参数只接受 creative、outfit_descriptions 和 analysis_settings 三个 JSON 对象。")
              creative = dict(options.get("creative", {}))
              for key, value in (("wan_mode", wan_mode), ("seedance_mode", seedance_mode), ("title", project_title), ("title_mode", title_mode)):
                  if value and (key == "title" or value != "auto"):
                      creative[key] = value
              if camera_mode == "fixed_single_take":
                  creative["single_take"] = True
                  creative["camera_lock"] = "fixed"
              if creative:
                  options["creative"] = creative
              if timing_mode and timing_mode != "auto":
                  options.setdefault("analysis_settings", {})["timing_mode"] = timing_mode
              # An uploaded file travels on the neighboring native multipart file field.
              payload = {"mode": asset_mode, "target_model": target,
                         "inputs": {"case_id": (case_id or "").strip(), "library_name": (library_name or "").strip(), "outfit_order": (outfit_order or "").strip(), "reuse_only": reuse_only == "yes",
                                    "stage_run_directory": (stage_run_directory or "").strip(), "analysis_execution_id": uuid.uuid4().hex, **options},
                         "reference_video": (reference_video_path or "").strip(), "tryon_manifest": manifest}
              return {"payload_json": json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
                      "materials_manifest_json": json.dumps(manifest, ensure_ascii=False, separators=(",", ":"))}
        variables:
        - variable: materials_manifest_json
          value_selector:
          - '1795109610014'
          - output
          value_type: string
        - variable: asset_mode
          value_selector:
          - '1795050000000'
          - asset_mode
          value_type: string
        - variable: target_model
          value_selector:
          - '1795050000000'
          - target_model
          value_type: string
        - variable: case_id
          value_selector:
          - '1795050000000'
          - case_id
          value_type: string
        - variable: reference_video_path
          value_selector:
          - '1795050000000'
          - reference_video_path
          value_type: string
        - variable: scene_anchor_source
          value_selector:
          - '1795050000000'
          - scene_anchor_source
          value_type: string
        - variable: scene_anchor_path
          value_selector:
          - '1795050000000'
          - scene_anchor_path
          value_type: string
