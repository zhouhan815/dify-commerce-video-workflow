    - id: '1795109610023'
      type: custom
      data:
        type: code
        title: 核对视频生成授权与素材
        desc: 没有正式确认和可提交计划，只交付提示词。
        code_language: python3
        code: |
          import json
          import re

          def main(operation: str, approval: str, generation_key: str, analysis_json: str,
                   request_plan_json: str, video_prompt: str, checks_json: str, ark_assets: str = "") -> dict:
              plan = json.loads(request_plan_json)
              if operation != "generate":
                  return {"render_gate": "closed", "request_json": "", "render_note": "本次仅编译，未生成视频。"}
              if approval != "确认生成视频":
                  return {"render_gate": "closed", "request_json": "", "render_note": "尚未明确确认生成，已保留提示词。"}
              if not generation_key or not re.fullmatch(r"[A-Za-z0-9_-]{12,80}", generation_key):
                  return {"render_gate": "closed", "request_json": "", "render_note": "缺少可复用的本次生成标识。"}
              checks = json.loads(checks_json)
              if checks.get("ok") is not True or checks.get("portrait_gate", {}).get("status") == "blocked" or plan.get("ready_to_submit") is not True:
                  return {"render_gate": "closed", "request_json": "", "render_note": "素材计划未通过生成校验。"}
              approved_assets = json.loads(ark_assets or "{}")
              filled = {item["label"] for item in plan.get("assets", [])}
              if not isinstance(approved_assets, dict) or not set(approved_assets) <= filled or not all(
                      isinstance(uri, str) and re.fullmatch(r"asset://[A-Za-z0-9_./-]+", uri) for uri in approved_assets.values()):
                  raise ValueError("只接受已获批素材的本次图或视频槽位与 asset:// 映射。")
              payload = json.dumps({"approved": True, "ark_assets": approved_assets, "generation_key": generation_key, "request_plan": plan,
                                    "prompt": video_prompt, "evidence_json": analysis_json},
                                   ensure_ascii=False, separators=(",", ":"))
              if len(payload) > 400000:
                  raise ValueError("生成请求的审核材料超过工作流字段上限。")
              return {"render_gate": "open", "request_json": payload, "render_note": "已通过 Dify 生成入口校验。"}
        variables:
        - variable: operation
          value_selector:
          - '1795050000000'
          - operation
          value_type: string
