                      if summary:
                          lines.append(cue + summary + "。")
                      if row["phases"]:
                          lines.append(_timed_performance(row) + "。")
              if any(row["fabric"] for row in rows):
                  lines.append("衣料随原动作受力，内肘和承重膝只压出少量浅褶，伸展后舒开，松紧随材质变化。")
              if creative.get("source_native_audio", True):
                  lines.append("动作保留原片拍点，原声后期从零点合回。")
