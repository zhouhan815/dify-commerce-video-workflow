    - id: '1795109900000'
      type: custom
      data:
        type: code
        title: 识别业务需求
        desc: 优先使用手选路线，口述需求不明确时询问具体任务。
        code_language: python3
        code: |
          import re

          def main(business_route="", request_text="", operation="", replacement_job_id="", uploaded_roles="none",
                   product_image_paths="", person_image_paths=""):
              choices = {"服装逆推与试穿": "fashion", "原片换商品": "product",
                         "原片换人物": "person", "原片同时换商品和人物": "both"}
              help_text = "请在「业务路线」选择服装逆推与试穿、原片换商品、原片换人物或原片同时换商品和人物，再次运行。"
              def result(route, mode="", reason=""):
                  return {"route": route, "replacement_mode": mode, "guidance": reason}
              if business_route and business_route != "auto":
                  mode = choices.get(business_route)
                  if mode == "fashion":
                      return result("fashion")
                  if mode:
                      return result("replacement", mode)
                  return result("clarify", reason=help_text)
              resuming = bool(replacement_job_id) or operation == "replacement_status"
              brief = (request_text or "").lower().strip()
              supplied = {role for role, paths in (("product", product_image_paths), ("person", person_image_paths))
                          if paths or uploaded_roles in (role, "both")}
              if not brief:
                  if resuming:
                      return result("replacement")
                  if supplied:
                      return result("replacement", "both" if len(supplied) == 2 else next(iter(supplied)))
                  if operation == "replacement_analyze":
                      return result("clarify", reason="新任务请指定原片换商品、换人物或同时替换，并提供目标参考图。已有任务可直接填写任务编号。")
                  return result("fashion")  # Existing API clients supply only the original fields.

              # Drop explicit preservation clauses before detecting the subjects of an edit.
              product = r"商品|产品|货品|货物|物品|手持物|手里的东西|衣服|服装|衣物|(?<=换)衣|(?<=换)品|鞋子|手表|水杯|杯子|包包|包袋|口红|瓶子|耳机|product|item"
              person = r"人物|人像|模特|演员|主持人|主角|主播|出镜人|代言人|角色|女生|男生|女孩|男孩|女主|男主|人脸|脸|人|model\b|person|actor"
              change = r"替换|替代|更换|调换|置换|换走|换掉|换成|更改为|改成|改为|换|replace|swap"
              fashion = bool(re.search(r"试穿|试衣|穿搭|服装逆推|逆推.{0,8}(?:服装|穿搭|试穿)|平铺图|白底图.{0,6}(?:上身|穿)|换装视频|(?:多|\d+)套换装|try[ -]?on", brief))
              roles = set()
              subject = r"([PH](?:\s*(?:和|与|跟|、|及|以及|还有|and|/)\s*[PH])?)"
              preserve = r"(?:保持不变|保持原样|保持不动|不用换|无需更换|不要换|不用动|别动|别换|不动|不换|不改|不变|照旧|保持|保留|沿用|锁定)"
              for clause in re.split(r"[，,。；;！？!?\n]", brief):
                  marked = re.sub(person, "H", re.sub(product, "P", clause))
                  held = r"(?:在|的)?(?:手持|手中|手里|手上|身上|手拿|拿着|展示)(?:穿着|穿|拿着|拿|戴着|戴|的|那|这|一|个|件|款|只)*P"
                  marked = re.sub("(?:H|他|她)" + held, "P", marked)
                  marked = re.sub(r"(和|与|跟|及|、)(?:他|她|其|自己)?" + held, r"\1P", marked)
                  marked = re.sub(preserve + r"(?:原片里的?|原有|原来的?|原|这个|该)?\s*" + subject, " ", marked)
                  marked = re.sub(subject + r"\s*(?:都|也|要|先)?" + preserve, " ", marked)
                  marked = re.sub(change, "V", marked)
                  after = r"V\s*(?:(?:一下|个|成|掉|原片|原视频|视频|片|这|那|新|旧|原来|原有|原|目标|我们|我|这个|那个|里面|里|中|的|手持|手里|展示|镜头|the|a|\s)\s*)*"
                  before = r"(?:一起|全都|都|同时|也|直接|给我|给|全部|要|先|只|仅|的外观|的身份|重新|进行|做个|做|\s)*V"
                  for pattern in (after + subject, subject + before):
                      for match in re.finditer(pattern, marked):
                          roles.update("product" if mark == "P" else "person" for mark in re.findall("[PH]", match[1]))
              if fashion and (roles or resuming):
                  return result("clarify", reason="需求同时提到试穿制作与原片局部替换。" + help_text)
              if fashion:
                  return result("fashion")
              if roles:
                  return result("replacement", "both" if len(roles) == 2 else next(iter(roles)))
              if supplied and re.search(change, brief):
                  return result("replacement", "both" if len(supplied) == 2 else next(iter(supplied)))
              if resuming and not re.search(change, brief):
                  return result("replacement")
              return result("clarify", reason="请说明是重新制作试穿视频，还是保留原片镜头并指定要替换的商品或人物。" + help_text)
        variables:
        - variable: business_route
          value_selector:
          - '1795050000000'
          - business_route
          value_type: string
        - variable: request_text
          value_selector:
          - '1795050000000'
          - request_text
          value_type: string
        - variable: operation
          value_selector:
          - '1795050000000'
          - operation
          value_type: string
        - variable: replacement_job_id
          value_selector:
          - '1795050000000'
          - replacement_job_id
          value_type: string
        - &id008
          variable: uploaded_roles
          value_selector:
          - '1795109900015'
          - output
          value_type: string
        - &id009
          variable: product_image_paths
          value_selector:
          - '1795050000000'
          - product_image_paths
          value_type: string
        - &id010
          variable: person_image_paths
          value_selector:
          - '1795050000000'
          - person_image_paths
          value_type: string
        outputs:
          route:
            type: string
            children: null
          replacement_mode:
            type: string
            children: null
          guidance:
            type: string
            children: null
      position:
        x: 390
        y: -940
      positionAbsolute:
        x: 390
        y: -940
      width: 270
      height: 100
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1795109900001'
      type: custom
      data:
