    - id: '1795050004000'
      type: custom
      data:
        type: code
        title: 读取模特参考素材
        desc: ''
        code_language: python3
        code: |
          import json

          def main(body: str, status_code: int) -> dict:
              if not str(body or "").lstrip().startswith("{"):
                  raise ValueError(f"Dify 调用模特素材服务得到 HTTP {status_code}，未收到 JSON。请检查 Docker 到本机图片服务的连接。")
              record = json.loads(body)
              if status_code != 200 or not record.get("run_id") or not record.get("model_image"):
                  raise ValueError(str(record.get("error") or record.get("detail") or "模特素材处理未完成。"))
              return {
                  "run_id": record["run_id"],
                  "model_image": record["model_image"],
                  "model_record_json": json.dumps(record, ensure_ascii=False, separators=(",", ":")),
              }
        variables:
        - variable: body
          value_selector:
          - '1795050002000'
          - body
          value_type: string
        - variable: status_code
          value_selector:
          - '1795050002000'
          - status_code
          value_type: number
        outputs:
          run_id:
            type: string
            children: null
          model_image:
            type: object
            children: null
          model_record_json:
            type: string
            children: null
      position:
        x: 1000
        y: 60
