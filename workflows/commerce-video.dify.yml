      data:
        type: code
        title: 读取替换制作表与任务状态
        desc: 显示素材映射、提示词、任务链接与本次操作结果。
        code_language: python3
        code: |
          import json

          def main(body):
              try:
                  record = json.loads(body)
              except (TypeError, ValueError):
                  record = {}
              if not isinstance(record, dict) or not record:
                  record = {"status": "service_error", "error": "本机媒体服务未返回有效回执。请检查 8795 端口服务，已有任务可按编号回查。"}
              status = str(record.get("status") or "service_error")
              instructions = {
                  "needs_review": "打开制作表查看素材。需要分析本次原片时，选 replacement_analyze 并填入任务编号。",
                  "analyzing": "稍后选 replacement_status 并填入任务编号，查看制作表。",
                  "prepared": "打开制作表核对提示词和素材。确认后选择 generate，填写任务编号、确认词和生成标识。",
                  "submitted": "已提交。选 replacement_status 并填入任务编号，或打开任务页查看进度。",
                  "complete": "打开成片链接查看结果。",
                  "completed": "打开成片链接查看结果。",
              }
              error = record.get("error")
              instruction = instructions.get(status) or ("按编号查看任务页，或选 replacement_status 更新回执。" if not error else "")
              message = " ".join(str(item) for item in (error or record.get("message"), instruction) if item)
              return {"replacement_status": status, "replacement_job_id": str(record.get("job_id") or record.get("run_id") or ""),
                      "replacement_next_step": message,
                      "replacement_review_url": str(record.get("review_url") or ""),
                      "replacement_status_url": str(record.get("status_url") or ""),
                      "replacement_watch_url": str(record.get("watch_url") or ""),
                      "replacement_video_url": str(record.get("final_video_url") or ""),
                      "replacement_prompt": str(record.get("prompt") or ""),
                      "replacement_prompt_sha256": str(record.get("prompt_sha256") or ""),
                      "replacement_receipt_json": json.dumps(record, ensure_ascii=False, separators=(",", ":"))}
        variables:
        - variable: body
          value_selector:
          - '1795109900011'
          - output
          value_type: string
        outputs:
          replacement_status:
            type: string
            children: null
          replacement_next_step:
