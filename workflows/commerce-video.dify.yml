    - id: '1795109610020'
      type: custom
      data:
        type: code
        title: 读取媒体分析证据
        desc: 提取证据，或显示需要复核的具体原片帧段。
        code_language: python3
        code: |
          import json

          def main(body: str, materials_manifest_json: str) -> dict:
              record = json.loads(body)
              if record.get("status") == "needs_review":
                  issues = record.get("issues", [])
                  if not isinstance(issues, list):
                      issues = [issues]
                  issues = [str(item) for item in issues if item]
                  audit_path = str(record.get("audit_path") or "")
                  message = str(record.get("error") or "逐帧证据需要复核")
                  lines = [message, *(f"- {item}" for item in issues)]
                  if audit_path:
                      lines.append(f"本机核对表 {audit_path}")
                  return {"prepare_status": "needs_review", "envelope": "", "review_summary": "\n".join(lines),
                          "review_issues_json": json.dumps(issues, ensure_ascii=False), "audit_path": audit_path}
              if not isinstance(record.get("evidence_json"), str) or not record["evidence_json"].strip():
                  raise ValueError(str(record.get("error") or record.get("detail") or "参考片分析服务没有返回有效证据。"))
              physical_assets = json.loads(materials_manifest_json)
              return {"prepare_status": "ready", "review_summary": "", "review_issues_json": "[]", "audit_path": "",
                      "envelope": json.dumps({"evidence_json": record["evidence_json"], "materials": physical_assets},
                                               ensure_ascii=False, separators=(",", ":"))}
        variables:
        - variable: body
          value_selector:
          - '1795109610019'
          - output
          value_type: string
        - variable: materials_manifest_json
          value_selector:
          - '1795109610015'
          - materials_manifest_json
          value_type: string
        outputs:
          envelope:
            type: string
            children: null
          prepare_status:
