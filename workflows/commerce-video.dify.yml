        - variable: uploaded_video_name
          value_selector:
          - '1795050000000'
          - reference_video
          - name
          value_type: string
        - *id008
        - *id009
        - *id010
        outputs:
          action:
            type: string
            children: null
          job_id:
            type: string
            children: null
          expected_mode:
