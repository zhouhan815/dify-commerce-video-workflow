              if creative.get("lighting"):
                  lines.append(_text(creative["lighting"]).rstrip("。") + "。")
              if creative.get("title"):
                  lines.append("清除原片标题。" + _title_frame(creative))
              if creative.get("opening_action"):
                  lines.append(_text(creative["opening_action"]))
              if creative.get("opening_closed_mouth") is True:
                  lines.append("开场双唇自然闭合。")
              lines.append("除上述指定编辑外，母版其他可见物保持原样。")
              if _changes(rows):
                  lines.append("按下列原片区间替换全套衣鞋和当款配件，从换入帧保持至该款结束。")
              elif rows:
                  lines.append(f"全程一款，穿{_ref(rows[0]['slot'],True)}的完整衣鞋。")
              spans=[]
              for row in rows:
                  if not spans or row["slot"]!=spans[-1][0]["slot"]:
                      spans.append([row])
