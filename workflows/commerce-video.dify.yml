                          lines.append(f"机位与构图沿用{edit_target}。")

              if changes and rows[0]["slot"]:
                  opening = _ref(rows[0]["slot"], flash)
                  clock = "原片" if flash and editing else "目标"
                  lines.insert(1, f"开场 0.000–{_t(changes[0]['start_s'])} 秒一直穿 {opening} 全套，只做连续表演。")
                  times = "，".join(f"{_t(row['start_s'])}秒 {_ref(row['slot'], flash)}" for row in changes)
                  lines.insert(2, f"仅在以下 {len(changes)} 个{clock}时间换装：{times}。每套完整衣裤裙鞋袜从切入保持到下一次换装。")
              elif rows and rows[0]["slot"]:
                  lines.append(f"全程一款，穿{_ref(rows[0]['slot'],flash)}的完整衣鞋。")
              if _text(creative.get("opening_action")):
                  lines.insert(3, "开场表演：" + _text(creative["opening_action"]) + "。")

              for item in assets:
                  if item["type"] == "reference_video":
                      if item is not first_video:
                          lines.append(f"{item['ref']} 提供{item['description'] or '补充动作参考'}。")
                      continue
                  base = item["description"] or "对应套装的衣、裤裙和鞋袜"
                  if item is first_image and (face or scene):
                      role = "目标人物和开场整套" if creative.get("opening_image_context") == "wardrobe_only" else "目标人物、同场光影和开场整套"
                      duty = f"{role}，{base}"
                  else:
                      duty = base
                  code = f"（服装{item['outfit_id']}）" if item.get("outfit_id") else ""
                  lines.append(f"{item['ref']}{code}：{duty}。")

              preserve = [_text(value) for value in (creative.get("preserve") or []) if _text(value)]
              if preserve:
                  lines.append("指定保留：" + "、".join(preserve) + "。")
              if lighting:
                  lines.append(f"光线与受力：{lighting}")
              if creative.get("opening_closed_mouth") is True:
                  lines.append("开场双唇自然闭合。")
              if preserve_audio:
                  lines.append("声音后期使用原声；画面动作按时间位完成。")
              elif _text(creative.get("sound")):
                  lines.append("声音：" + _text(creative["sound"]) + "。")
              if _text(creative.get("title")):
                  lines.append("清除参考片原有标题。" + _title_frame(creative))
              if flash and editing:
                  lines.append("其余未指定编辑的可见元素沿用母版，维持前后遮挡顺序。")
              if changes:
                  lines.append("衣裤裙鞋袜逐套锁定，配饰只依当套图。换装时刻进入新衣和当段姿势，拍内强弱和衣料受力随动作自然变化。")

              for index, row in enumerate(rows):
                  slot = row["slot"]
                  prior_slot = rows[index - 1]["slot"] if index else None
                  if not slot:
                      wardrobe = ""
                  elif prior_slot and slot != prior_slot:
                      wardrobe = f"入拍瞬换 {_ref(slot, flash)} 全套，保持至本段结束。"
                  else:
                      wardrobe = f"全段穿 {_ref(slot, flash)}。"
                  beat = f" {row['beat']}" if row["beat"] and row["beat"] != "opening" else ""
                  fabric = f" 衣料：{row['fabric']}。" if row["fabric"] else ""
                  performance = _segment_performance(row, row["brief"], row["cue"], row["actor_cue"], row["action"], row["face"])
                  lines.append(f"{_t(row['start_s'])}–{_t(row['end_s'])}秒{beat}｜{wardrobe}{performance}。{fabric}")
                  if row["phases"]:
                      lines.append(_timed_performance(row) + "。")
              return "\n".join(lines)


          def _wan_room_and_wardrobe(pack, assets, rows, prompt):
              """Bind the empty room and ten timed looks to ten physical image references."""
              if not isinstance(pack, dict) or len(assets) != 10 or any(
                  item.get("type") != "reference_image" or not item.get("outfit_id") for item in assets
              ) or len({item["outfit_id"] for item in assets}) != 10:
                  raise ValueError("独立空景排图需要十张不同款号的全身穿搭图。")
              room, pair = pack.get("room"), pack.get("pair")
              for item in (room, pair):
                  if not isinstance(item, dict) or not item.get("local_path") or not item.get("bytes") or not re.fullmatch(
                      r"[a-f0-9]{64}", str(item.get("sha256", ""))
                  ):
                      raise ValueError("独立空景与双栏图须具有路径、字节数及文件指纹。")
              if len({room["sha256"], pair["sha256"], *(a["sha256"] for a in assets)}) != 12:
                  raise ValueError("空景和双栏服装须绑定不同于原始试穿的图片。")
              if pair.get("source_sha256s") != [a.get("sha256") for a in assets[-2:]]:
                  raise ValueError("双栏的左、右来源须依次对应最后两套原始试穿。")
              physical = [dict(room, asset_purpose="empty_room"), *assets[:-2], dict(pair, asset_purpose="two_outfit_panels")]
              physical = [dict(a, label=f"图{i}", ref=f"图{i}", type="reference_image",
                               transmission_status="local_only") for i, a in enumerate(physical, 1)]
              addresses = [a["label"] for a in physical[1:-1]] + ["图10左栏", "图10右栏"]
              by_label = {a["label"]: address for a, address in zip(assets, addresses)}
              by_outfit = {a["outfit_id"]: by_label[a["label"]] for a in assets}
              if {r["outfit_id"] for r in rows} != set(by_outfit):
                  raise ValueError("时间轴与空景排图的十款映射不全。")
              prompt = re.sub(r"图\d+", lambda m: by_label[m[0]], prompt)
              prompt = prompt.replace("每张图提供该套", "各穿搭参考提供当套")
              instructions = ("图1是全片唯一的空景参考。透视、场景纹理和清晰度都跟随这张空景。"
                              "图2标定人物与首套衣鞋。"
                              "图10左右并列两张全身搭配，按下文左栏或右栏单独换款，全片只出现一位模特。")
              rows = [dict(r, logical_slot=r["slot"], slot=by_outfit[r["outfit_id"]]) for r in rows]
              return instructions + "\n" + prompt, physical, rows


          def _wan_board_bind(pack, assets, rows):
              """Bind this project's row-major contact sheet to its verified logical looks."""
              if not isinstance(pack, dict) or pack.get("schema_version") != 1:
                  raise ValueError("服装格图板格式无效。")
              row_count, columns = pack.get("rows"), pack.get("columns")
              count = len(assets)
              if (type(row_count) is not int or type(columns) is not int or not 1 <= count <= 10
                      or not 1 <= columns <= count or row_count != ceil(count / columns)):
                  raise ValueError("图板行列须覆盖本次 1–10 套衣服，按行填满，只允许末行末尾留空。")
              room, board, cells = pack.get("room"), pack.get("board"), pack.get("cells")
              def valid_hash(value):
                  return bool(re.fullmatch(r"[a-f0-9]{64}", str(value)))
              for picture in (room, board):
                  if (not isinstance(picture, dict) or not picture.get("local_path") or not valid_hash(picture.get("sha256"))
                          or type(picture.get("bytes")) is not int or not 0 < picture["bytes"] <= 20_000_000
                          or any(type(picture.get(k)) is not int or not 240 <= picture[k] <= 8000 for k in ("width", "height"))):
                      raise ValueError("空景与服装图板须提供可核对的路径、实测尺寸、文件大小与指纹。")
              if (room["sha256"] == board["sha256"] or board["width"] % columns or board["height"] % row_count
                      or board["width"] // columns < 320 or board["height"] // row_count < 480):
                  raise ValueError("空景须是独立图片，图板须有等宽等高且能看清鞋的全身格。")
              if (not isinstance(cells, list) or len(cells) != count
                      or len({a.get("outfit_id") for a in assets}) != count
                      or any(a.get("type") != "reference_image" or not a.get("outfit_id") for a in assets)):
                  raise ValueError("各格须分别绑定本项目不同的已验证试穿款号。")
              chronology = [rows[0]["outfit_id"]] + [r["outfit_id"] for r in _changes(rows)] if rows else []
              if chronology != [a["outfit_id"] for a in assets]:
                  raise ValueError("服装格顺序须等于时间表中的开场和各次换款。")
              by_outfit = {}
              white_hashes = set()
              for index, (cell, item) in enumerate(zip(cells, assets)):
                  r, c = divmod(index, columns)
                  if (not isinstance(cell, dict) or (cell.get("row"), cell.get("column"), cell.get("code")) != (r+1, c+1, f"K{index+1:02d}")
                          or cell.get("outfit_id") != item["outfit_id"] or not valid_hash(item.get("sha256"))
                          or cell.get("logical_sha256") != item["sha256"] or not valid_hash(cell.get("white_sha256"))
                          or cell["white_sha256"] in white_hashes or not _text(cell.get("description"))):
                      raise ValueError(f"第{index+1}格的坐标、款号、白底来源或逻辑试穿绑定不符。")
                  by_outfit[item["outfit_id"]] = f"图2第{r+1}行第{c+1}列 {cell['code']}"
                  white_hashes.add(cell["white_sha256"])
              physical = [dict(room, asset_purpose="empty_room"), dict(board, uniform_look_board=True, asset_purpose="uniform_look_board",
                                                                      grid_rows=row_count, grid_columns=columns, cell_count=count)]
              for i, item in enumerate(physical, 1):
                  item.update(label=f"图{i}", ref=f"图{i}", type="reference_image", transmission_status="local_only")
              remapped = [dict(row, logical_slot=row["slot"], slot=by_outfit[row["outfit_id"]]) for row in rows]
              return physical, remapped


          def _wan_clean_performance(value, title):
              """Translate editor-only reveal cues across *all* provider-facing fields."""
              value = _text(value)
              if title and title in value:
                  raise ValueError("逐字文案仅给本地渲染，不能进入任何拍内表演字段。")
              value = re.sub(r"(?:引人看|让观众看|引导观众看)(?:向)?(?:横向|横排|横)?(?:标题|字幕)", "引导视线看向画面留白", value)
              value = re.sub(r"(?:把|将)(?:横向|横排|横)?(?:标题|字幕)(?:带向|引向|拉向|扫向)", "引向", value)
              value = re.sub(r"(?:带出|引出|拉出|揭出|滑出|扫出)(?:横向|横排|横)?(?:标题|字幕)", "呈现画面留白", value)
              if re.search(r"标题|字幕|文案|揭字|显字|片名|生成文字|写字", value):
                  raise ValueError("拍内仍有字幕制作指令，须改写成肢体、视线或留白后再送模。")
              return value


          def native_room_creative(creative):
              """Keep project lighting, including its direction, and derive shared lighting only if unspecified."""
              light = _performance_text(creative.get("room_key_light"), creative.get("lighting"))
              return dict(creative, lighting=light or "依空景实际明暗统一人物和环境的受光方向。")


          def _standing_directions(stage):
              if not stage:
                  return []
              framing = _text(stage.get("opening_framing"))
              mark = (f"{_t(stage['static_from_s'])}秒站定时，躯干中心在画宽{stage['x_center']:.0%}，"
                      f"发顶在画高{stage['head_y']:.0%}、鞋底在{stage['shoe_y']:.0%}，全身约占画高{stage['person_height']:.0%}。")
              return ([framing] if framing else []) + [mark]


          def _board_composition(stage, creative, pack, source):
              """Use the approved room for architectural landmarks and the source frame for body framing."""
              framing = creative.get("wan_reference_composition")
              if framing is None:
                  return stage
              room = pack["room"]
              if (not isinstance(framing, dict) or not framing.get("room_sha256")
                      or framing["room_sha256"] not in (room["sha256"], room.get("source_sha256"))
                      or framing.get("source_sha256") != source.get("sha256")):
                  raise ValueError("取景标定与当前送模空景或动作原片指纹不符。")
              ref = framing.get("actor_target") or {}
              geo = framing.get("anchor_geometry") or {}
              if ((geo.get("width"), geo.get("height")) != (room["width"], room["height"])
                      or not isinstance(framing.get("source_measurement"), dict)):
                  raise ValueError("空间标定画幅或原片量尺记录与本次素材不符。")
              keys = ("x_center", "head_y", "shoe_y")
              x, head, shoe = (_seconds(ref.get(k)) for k in keys)
              left, right, top, base = (_seconds(geo.get(k)) for k in
                  ("door_inner_left_x", "door_inner_right_x", "door_inner_lintel_y", "door_base_y"))
              settle = _seconds(framing.get("opening_settle_s"))
              if (None in (x, head, shoe, settle) or not 0 < x < 1 or not 0 <= head < shoe <= 1
                      or not 0 <= settle <= stage["retreat_end_s"]):
                  raise ValueError("人物站位与开场稳定时点缺少可用标定。")
              if any(v is not None for v in (left,right,top,base)) and (
                      None in (left,right,top,base) or not 0 < left < x < right < 1 or not 0 <= top < head < base <= shoe <= 1):
                  raise ValueError("项目提供的门洞量尺与人物标定不一致。")
              return dict(stage, **dict(zip(keys, (x, head, shoe))), person_height=round(shoe-head,4),
                          anchor_geometry=dict(geo), opening_settle_s=settle,
                          source_measurement=framing["source_measurement"], framing_room_sha256=room["sha256"],
                          person_height_tolerance=0.05, x_center_tolerance=0.045)


          def _wan_board_prompt(creative, pack, rows, stage):
              """Use only the bound project and its measured windows to direct each costume hold."""
              title = _text(creative.get("title"))
              spans = []
              for row in rows:
                  if not spans or spans[-1][0]["slot"] != row["slot"]:
                      spans.append([])
                  spans[-1].append(row)

              stage = stage or {}
              first_cut = _t(spans[0][-1]["end_s"])
              changes = [f"{_t(span[0]['start_s'])}秒 {span[0]['slot']}（{cell['description']}）"
                         for span,cell in zip(spans[1:],pack["cells"][1:])]
              fabrics = {_text(r["fabric"]).replace("按该张衣鞋图，","").rstrip("。") for r in rows}
              shared_fabric = _wan_clean_performance(next(iter(fabrics)),title) if len(fabrics)==1 else "肘膝弯曲时衣料起少量浅褶，舒展后放松"
              lines = [
                  f"【核心任务】图1给出空间结构与光向，图2是同一个人的{len(spans)}套全身衣鞋目录。人物与环境同场实拍。图2共{pack['rows']}行{pack['columns']}列，从上到下逐行自左向右，仅取已绑定服装格。",
                  f"【款序】0秒起至{first_cut}秒穿{spans[0][0]['slot']}（{pack['cells'][0]['description']}）。",
                  f"【读表】时间从0秒起，左右按画面。括号给演员意图和力度，1极轻、5最强。每行是一段穿衣时间；相邻表演锚点之间按时完成动作。统一衣影：{shared_fabric}；鞋底接触影随支撑变化。",
              ]
              if changes:
                  lines.insert(2, "【换款时刻】" + " → ".join(changes) + "。每款持续至下一次换款或片尾。")
              else:
                  lines.insert(2, "全程一款，保持该格的完整衣鞋。")
              if creative.get("scene"):
                  lines.append("【场景】" + _text(creative["scene"]))
              if creative.get("opening_action"):
                  lines.append("【开场表演】" + _wan_clean_performance(creative["opening_action"],title))
              if creative.get("opening_closed_mouth") is True:
                  lines.append("【开场口型】开场双唇自然闭合。")
              for index, span in enumerate(spans):
                  first, last = span[0], span[-1]
                  phases, extras = [], []
                  for part in span:
                      cue = _text(part.get("actor_cue") or part.get("brief") or part.get("cue"))
                      bounds = part.get("source_frames") or []
                      minimum = 1 if len(bounds) == 2 and bounds[0] == bounds[1] else 2
                      if not all((part.get("action"), part.get("face"), part.get("fabric"), cue)) or len(part.get("phases", [])) < minimum:
                          raise ValueError(f"{part['section']} 缺少拍内动作、面部、衣料或导演证据。")
                      _wan_clean_performance(part["action"],title)
                      _wan_clean_performance(part["face"],title)
                      cue = _wan_clean_performance(cue,title)
                      affect = part["affect"]
                      intent = _wan_clean_performance(affect["label"],title)
                      direction = _segment_performance(part, cue)
                      note = _performance_text(f"{intent}，{affect['intensity']}/5", direction)
                      # Keep the project's playable acting instruction even when it uses unfamiliar vocabulary.
                      for j, phase in enumerate(part["phases"]):
                          action = _performance_text(phase.get("brief"),phase.get("action"),phase.get("face"))
                          if not action:
                              raise ValueError("拍内锚点缺少可见的动作或神态。")
                          if j == 0:
                              action = f"（{note}）" + action
                          phases.append(f"{_t(phase['target_s'])}秒 " + _wan_clean_performance(action,title))
                      if part.get("body_amplitude"):
                          extras.append(_wan_clean_performance(part["body_amplitude"],title))
                      fabric = _text(part["fabric"]).replace("按该张衣鞋图，","").rstrip("。")
                      if fabric != shared_fabric and fabric not in extras:
                          extras.append(_wan_clean_performance(fabric,title))
                  interval = f"{_t(first['start_s'])}–{_t(last['end_s'])}秒"
                  fields = (("时段",interval),("款位",("连续开场 " if index == 0 else "换入 ") + first["slot"]),
                            ("拍内动作与神态","；".join(phases)),("衣影与幅度","；".join(extras) or "按统一衣影和拍内落点"))
                  lines.append("｜".join("【"+key+"】"+_wan_clean_performance(value,title) for key,value in fields))
              lines.extend([
                  "【运镜与核心约束】" + _camera(creative) + "人物遮挡移开后，原场景位置保持连续。头和重心随动作平顺移动。",
                  "【同场光线】" + _text(creative["lighting"]) + "。" + (_text(stage.get("shadow_review")) or
                      "承重鞋底有接触影，抬脚时接触影随之分开，落脚时接回；脸部转动和衣褶起伏时明暗自然变化。"),
              ])
              if creative.get("source_native_audio", True):
                  lines.append("【声音】原声后期合入。")
              elif creative.get("sound"):
                  lines.append("【声音】" + _text(creative["sound"]))
              if title:
                  lines.append("【画面留白】" + _title_frame(creative))
              lines.extend("【站位】" + value for value in _standing_directions(stage))
              geometry = stage.get("anchor_geometry") or {}
              lintel = _seconds(geometry.get("door_inner_lintel_y"))
              base = _seconds(geometry.get("door_base_y"))
              if lintel is not None and base is not None and 0 <= lintel < stage["head_y"] < base <= 1:
                  clearance = (stage["head_y"] - lintel) / (base - lintel)
                  lines.append(f"【远端构图】站定后，图1门洞内横梁至地面的高度作为尺子，发顶比横梁低约门洞高度的{clearance:.0%}。"
                               "同一次换装前后，画边看到的家具范围一致。")
              if stage.get("framing_room_sha256") and geometry.get("door_inner_left_x") is not None:
                  left, right = geometry["door_inner_left_x"], geometry["door_inner_right_x"]
                  lines.append(f"【画边】站定后门洞内沿在画宽{left:.0%}和{right:.0%}处，换款时保持该画幅。")
              step=stage.get("retreat_translation")
              if step:
                  scale=stage["person_height"]/step["reference_person_height"]
                  lines.append(f"【末步幅度】{_t(step['start_s'])}–{_t(step['end_s'])}秒，{step['moving_foot']}落向更远的地纹；移动鞋尖在画面上移约{step['toe_advance_h']*scale:.1%}画高，骨盆随它上移约{step['hip_advance_h']*scale:.1%}画高，另一鞋先稳贴地。")
              exclusions = "人物瞬移，头胸高频左右颤动，场景变形，人影脱离动作，贴纸轮廓，双人并排，目录格号入画，自绘文字"
              lines.append("【避免】" + exclusions + ("，提前换衣，跳过某套，重复上一套。" if changes else "。"))
              prompt="\n".join(lines)
              if set(re.findall(r"图\d+",prompt))!={"图1","图2"} or re.search(r"左栏|右栏|入拍姿势可跳变",prompt):
                  raise ValueError("正文引用了旧图号、旧栏位或跳姿控制。")
              if _unbound_source(prompt) or "@图片" in prompt:
                  raise ValueError("两图路线须能脱离原视频执行。")
              if title and title in prompt:
                  raise ValueError("片头逐字文案仅可交给后期合成。")
              return prompt


          def compile_provider(analysis: dict, target_model: str) -> dict:
              """Return a local prompt, the documented request shape and structured checks."""
              source = analysis.get("source") or {}
              creative = analysis.get("creative") or {}
              errors, warnings = [], []
              flash = target_model == FLASH
              provider_mode = "seedance_mode" if flash else "wan_mode"
              mode = creative.get(provider_mode) or creative.get("workflow_mode") or "reference_regenerate"
              editing = mode == "edit_existing"
              images_only = mode == "images_only"
              if images_only and not flash and creative.get("wan_look_board") is not None:
                  creative = native_room_creative(creative)
              fps = FLASH_FPS if flash else WAN_FPS
              if target_model not in {WAN, FLASH}:
                  return {
                      "prompt": "",
                      "request_plan": {"model": target_model, "ready_to_submit": False},
                      "checks": {"ok": False, "errors": ["未知目标视频模型。"], "warnings": [],
                                 "portrait_gate": {"status": "not_evaluated", "blocked_assets": []}},
                  }
              if mode not in MODES and not images_only:
                  errors.append("未知工作流模式。")
              source_duration = _seconds(source.get("duration_s"))
              timeline = analysis.get("timeline") or []
              target_ends = [_seconds(row.get("end_s")) for row in timeline]
              target_ends = [value for value in target_ends if value is not None]
              params, preserve_audio = _provider_parameters(
                  creative, source_duration, max(target_ends, default=None), flash, editing, errors, warnings
              )
              title_mode = _title_mode(creative)
              title_times = {}
              if title_mode not in {"swipe", "static", "none"} or (creative.get("title") and title_mode == "none"):
                  errors.append("标题显现方式请用 swipe 或 static。")
              if title_mode != "none":
                  clip_end = source_duration if params["duration"] == -1 else _seconds(params["duration"])
                  for key in ("title_start_s", "title_end_s"):
                      if key in creative:
                          value = _seconds(creative[key])
                          if value is None or value < 0 or (clip_end is not None and value > clip_end):
                              errors.append(f"{key} 须在本片时长内。")
                          else:
                              title_times[key] = value
                  if title_times.get("title_start_s", 0) >= title_times.get("title_end_s", clip_end or float("inf")):
                      errors.append("标题结束时刻须晚于开始时刻。")
              items = analysis.get("assets") or []
              if images_only:
                  items = [item for item in items if item.get("type") != "reference_video"]
              packed_wan = images_only and not flash and (creative.get("wan_look_board") is not None or creative.get("wan_scene_pack") is not None)
              if not packed_wan:
                  items = _scene_reference(creative,items,errors)
              assets, images, blocked = _asset_mapping(
                  items, source, flash, editing, params["duration"], errors, warnings
              )
              room_refs = [item for item in assets if item.get("asset_purpose") == "empty_room"]
              if len(room_refs) > 1:
                  errors.append("本次空间只能绑定一张独立空景。")
              wardrobe_assets = [item for item in assets if item.get("asset_purpose") != "empty_room"]
              images = {slot:item for slot,item in images.items() if item.get("asset_purpose") != "empty_room"}
              scene_binding = ("\n" + room_refs[0]["ref"] + " 只控制全片目标场景的布局、透视和主光。穿搭图提供人物与对应衣鞋。") if room_refs else ""
              if images_only:
                  rows = _images_only_timeline(analysis, images, params["duration"], errors, warnings, fps)
              else:
                  rows = _timeline(timeline, images, source_duration, flash and editing, errors, warnings, reference_phases=True)
              _provider_acting_rows(rows, errors)
              if creative.get("opening_action"):
                  creative = dict(creative, opening_action=_visible_actor_text(creative["opening_action"]))
              if rows and params["duration"] != -1 and params["duration"] is not None and rows[-1]["end_s"] > params["duration"]:
                  errors.append("时间表超出输出视频时长。")
              changes = _changes(rows)
              use_source = flash and editing
              cut_key = "source_s" if use_source else "target_s"
              if not images_only and analysis.get("cuts"):
                  actual = [(row["slot"], row["outfit_id"], _t(row["start_s"])) for row in changes]
                  declared = [
                      (_label(row.get("slot")), _outfit(row.get("outfit_id")), _t(row[cut_key]))
                      for row in analysis["cuts"] if isinstance(row.get(cut_key), (int, float))
                  ]
                  if declared != actual:
                      errors.append("换装切点与时间表的片段、服装号或时刻不一致。")
              staging = _wan_staging(creative, images, rows, errors) if images_only and not flash else None
              look_board = creative.get("wan_look_board") if images_only and not flash else None
              room_pack = creative.get("wan_scene_pack") if images_only and not flash else None
              if look_board is not None:
                  prompt = ""
                  try:
                      if room_pack is not None:
                          raise ValueError("统一十格与旧的末两款并栏是两种互斥的实际素材格式。")
                      physical, remapped = _wan_board_bind(look_board, assets, rows)
                      if creative.get("wan_reference_composition") is not None and not staging:
                          raise ValueError("项目含参考机位标定，请同时提供与本次同场图匹配的站位标定。")
                      if staging:
                          staging = _board_composition(staging, creative, look_board, source)
                      prompt = _wan_board_prompt(creative, look_board, remapped, staging)
                      assets, rows = physical, remapped
                      if staging:
                          staging = dict(staging, anchor_label="本地同场站位标定", room_label="图1", wardrobe_label="图2")
                  except ValueError as exc:
                      errors.append(str(exc))
              elif images_only:
                  prompt = (_flash_images_prompt(creative, rows) if flash else _wan_images_prompt(creative, images, rows, changes, staging)) + scene_binding
                  if _unbound_source(prompt):
                      errors.append("图片生成正文引用了未送入模型的视频、音频或母版。")
                  image_tags = r"@图片\d+" if flash else r"图\d+"
                  image_refs = {_label(match) for match in re.findall(image_tags, prompt)}
                  if image_refs != set(images) | {item["label"] for item in room_refs}:
                      errors.append("图片生成正文的素材标签与请求中的参考图片不匹配。")
                  if flash and len(prompt) > 500:
                      warnings.append(f"完整表演正文共 {len(prompt)} 个字符。官方建议中文 500 字以内，须用实片检查短时动作执行率。")
              else:
                  prompt = _prompt(creative, wardrobe_assets, rows, changes, flash, editing, preserve_audio) + scene_binding
              if look_board is None and room_pack is not None and not errors:
                  try:
                      prompt, assets, rows = _wan_room_and_wardrobe(room_pack, assets, rows, prompt)
                      if staging:
                          staging = dict(staging, anchor_label=rows[0]["slot"], room_label="图1")
                  except ValueError as exc:
                      errors.append(str(exc))
              if not flash and len(prompt) > 20_000:
                  errors.append("万相提示词超过 20,000 字符，需先压缩，不能截断。")
              ok = not errors
              prompt_only = creative.get("prompt_only", analysis.get("prompt_only", True)) is True
              locked,single = _camera_flags(creative)
              return {
                  "prompt": prompt,
                  "request_plan": {
                      "model": target_model,
                      "provider": "volcengine_ark" if flash else "alibaba_dashscope",
                      "workflow_mode": mode,
                      "parameters": params,
                      "assets": assets,
                      "timeline": rows,
                      "timeline_clock": (("source_cuts_" if creative.get("timing_mode") == "source_cuts" else "target_music_")
                                         + f"{fps}fps") if images_only else ("source" if flash and editing else "target"),
                      **({"target_fps": fps} if images_only else {}),
                      "expected_video_duration_s": source_duration if flash and editing else params["duration"],
                      "postproduction": {
                          **({"strict_single_take": bool(locked and single and staging and "door_inner_lintel_y" in (staging.get("anchor_geometry") or {})),
                              "scene_rendering":"native_same_scene","geometry_review":"plate" if locked else "scene_identity",
                              "camera_lock":"geometry_only" if locked else "project_framing","lighting_policy":"shared_dynamic_scene_light"} if look_board is not None else {}),
                          **({"continuity_review": staging} if staging else {}),
                          "source_native_audio": preserve_audio,
                          "native_audio": source.get("native_audio") if preserve_audio else None,
                          "title": _text(creative.get("title")),
                          "title_mode": title_mode, **title_times,
                          "title_placement": _text(creative.get("title_timing")) or (
                              "按实际指尖滑动校准" if title_mode == "swipe" else "固定位置" if title_mode == "static" else ""
                          ),
                      },
                      "source_video_variants": {} if images_only else {
                          "original": source.get("video_with_audio"),
                          "optional_silent": source.get("optional_silent_video"),
                      },
                      **({"analysis_source_sha256": source.get("sha256")} if images_only else {}),
                      "documents": [SOURCES[target_model], SOURCES["ark_portrait"]] if flash else [SOURCES[target_model]],
                      "prompt_only": prompt_only,
                      "submission_status": "not_submitted",
                      "ready_to_submit": ok and not prompt_only,
                  },
                  "checks": {
                      "ok": ok,
                      "errors": errors,
                      "warnings": warnings,
                      "portrait_gate": {
                          "status": ("blocked" if blocked else "passed") if flash else "not_applicable",
                          "blocked_assets": blocked,
                      },
                  },
              }

          def main(analysis_json: str, target_model: str, operation: str, approval: str = "", generation_key: str = "",
                   seedance_mode: str = "") -> dict:
              import json
              import re
              target = {"Wan 3.0": WAN, "Seedance 2.5 Flash": FLASH}[target_model]
              analysis = json.loads(analysis_json)
              if target == FLASH and seedance_mode and seedance_mode != "auto":
                  if seedance_mode not in {"edit_existing", "images_only"}:
                      raise ValueError("请选择原片编辑或仅送试穿图。")
                  analysis["creative"]["seedance_mode"] = seedance_mode
              allowed = (operation == "generate" and approval == "确认生成视频"
                         and isinstance(generation_key, str) and re.fullmatch(r"[A-Za-z0-9_-]{12,80}", generation_key))
              analysis["creative"]["prompt_only"] = not bool(allowed)
              result = compile_provider(analysis, target)
              if not isinstance(result, dict) or not {"prompt", "request_plan", "checks"} <= result.keys():
                  raise ValueError("模型适配器返回不完整。")
              if not isinstance(result["prompt"], str) or not isinstance(result["request_plan"], dict) or not isinstance(result["checks"], dict):
                  raise ValueError("模型适配器返回字段类型错误。")
              plan_json = json.dumps(result["request_plan"], ensure_ascii=False, allow_nan=False, separators=(",", ":"))
              checks_json = json.dumps(result["checks"], ensure_ascii=False, allow_nan=False, separators=(",", ":"))
              if any(len(part) > 400000 for part in (result["prompt"], plan_json, checks_json)):
                  raise ValueError("模型适配内容超过工作流的单字段交付上限。")
              return {"video_prompt": result["prompt"], "request_plan_json": plan_json, "checks_json": checks_json,
                      "adaptation_evidence_json": json.dumps(analysis, ensure_ascii=False, allow_nan=False, separators=(",", ":"))}
        variables:
        - variable: analysis_json
