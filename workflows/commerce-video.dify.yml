    - id: '1795109900003'
      type: custom
      data:
        type: code
        title: 检查替换素材与本次动作
        desc: 新任务可准备素材或直接分析，已有任务凭编号接续。
        code_language: python3
        code: |
          import json
          import re

          def main(replacement_mode="", request_text="", operation="", replacement_job_id="", reference_video_path="",
                   product_image_paths="", person_image_paths="", product_note="", approval="", generation_key="",
                   replacement_prompt_sha256="", replacement_audio_sync="on", uploaded_video_name="", uploaded_roles="none"):
              job = (replacement_job_id or "").strip()
              def output(action, guidance="", payload=None):
                  return {"action": action, "job_id": job, "expected_mode": replacement_mode or "", "guidance": guidance,
                          "payload": json.dumps(payload or {}, ensure_ascii=False, separators=(",", ":"))}
              if job and not re.fullmatch(r"(?:[0-9a-f]{32}|[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}|active)", job):
                  return output("clarify", "请复制准备回执里的替换任务编号，或光序制作台的项目 UUID。")
              if operation in ("generate", "replacement_status") and not job:
                  return output("clarify", "请填写已有替换任务编号。首次运行请选 prompt_only，提交原片和目标参考图，取得编号后再继续。")
              if operation == "generate":
                  if job == "active":
                      return output("clarify", "请先查询 active，再复制回执中的具体任务编号用于生成。")
                  if approval != "确认生成视频" or not re.fullmatch(r"[A-Za-z0-9_-]{12,80}", generation_key or ""):
                      return output("clarify", "确认制作表后，在确认栏填写「确认生成视频」，并填写 12–80 位字母、数字、下划线或连字符组成的生成标识。")
                  fingerprint = (replacement_prompt_sha256 or "").strip()
                  if fingerprint and not re.fullmatch(r"[0-9a-f]{64}", fingerprint):
                      return output("clarify", "请复制制作表回执中的完整 prompt_sha256，或留空以核对上次预览。")
                  return output("generate", payload={"job_id": job, "expected_mode": replacement_mode or "", "operation": "generate", "approval": approval,
                                "generation_key": generation_key, "prompt_sha256": fingerprint})
              if operation == "replacement_analyze" and job:
                  return output("analyze", payload={"job_id": job, "expected_mode": replacement_mode or ""})
              if job:
                  return output("status")
              def paths(raw):
                  text = (raw or "").strip()
                  if text.startswith("["):
                      items = json.loads(text)
                      if not isinstance(items, list) or not all(isinstance(i, str) and i.strip() for i in items):
                          raise ValueError("路径列表须为非空字符串数组。")
                      return [item.strip() for item in items]
                  return [line.strip() for line in text.splitlines() if line.strip()]
              try:
                  payload = {"replacement_mode": replacement_mode, "request_text": request_text or "", "sync": replacement_audio_sync != "off",
                             "reference_video_path": (reference_video_path or "").strip(), "product_note": product_note or "",
                             "product_image_paths": paths(product_image_paths), "person_image_paths": paths(person_image_paths)}
              except ValueError:
                  return output("clarify", "参考图路径请每行填写一张，或提供有效的 JSON 字符串数组。")
              if operation == "replacement_analyze":
                  payload["analyze_if_needed"] = True
              # The service checks exact counts after it receives the ordered multipart files.
              counts = {role: len(payload[role + "_image_paths"]) + int(uploaded_roles in (role, "both"))
                        for role in ("product", "person")}
              missing = []
              if not (uploaded_video_name or payload["reference_video_path"]):
                  missing.append("原片")
              for role, label in (("product", "目标商品图"), ("person", "目标人物图")):
                  if replacement_mode in (role, "both") and not counts[role]:
                      missing.append(label)
              if missing:
                  return output("clarify", "请上传或填写本机路径以补齐" + "、".join(missing) + "，然后再次运行。")
              if sum(counts.values()) > 10:
                  return output("clarify", "商品和人物的参考图合计最多 10 张，请减少上传或路径条目。")
              if replacement_mode in counts and counts["person" if replacement_mode == "product" else "product"]:
                  return output("clarify", "所选替换范围与两组参考图不一致。请移除另一组目标图，或选择原片同时换商品和人物。")
              action = "prepare_upload" if uploaded_video_name or uploaded_roles in ("product", "person", "both") else "prepare_path"
              return output(action, payload=payload)
        variables:
        - variable: replacement_mode
          value_selector:
          - '1795109900000'
          - replacement_mode
          value_type: string
        - variable: operation
          value_selector:
          - '1795050000000'
          - operation
          value_type: string
        - variable: request_text
          value_selector:
          - '1795050000000'
          - request_text
          value_type: string
        - variable: reference_video_path
          value_selector:
