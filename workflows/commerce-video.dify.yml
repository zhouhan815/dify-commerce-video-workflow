    - id: '1795109610007'
      type: custom
      data:
        type: code
        title: 汇总既有试穿
        desc: 只有上传图及其证据，不虚构上游素材。
        code_language: python3
        code: |
          import json
          import re

          def main(results: list, outfit_order: str = "") -> dict:
              order = [item for item in re.split(r"[,，、→\s]+", (outfit_order or "").strip()) if item]
              if order and (len(order) != len(results or []) or len(set(order)) != len(order)):
                  raise ValueError("上传顺序必须逐张声明，服装编号须完整且不重复。")
              tryon_images, issues = [], []
              for index, response in enumerate(results or []):
                  try:
                      record = json.loads(response)
                  except (TypeError, ValueError):
                      record = {}
                  if not record.get("tryon_image"):
                      issues.append({"source_index": index, "message": str(record.get("error") or record.get("detail") or "缺少试穿图。")})
                      continue
                  asset = record["tryon_image"]
                  outfit = order[index] if order else record["look_id"]
                  tryon_images.append({"look_id": record["look_id"], "outfit_id": outfit, "image": asset, **asset, "description": record.get("description", ""), "physical_qa": record.get("physical_qa", {})})
              manifest = {"model_reference": None, "garment_images": [], "tryon_images": tryon_images,
                          "issues": issues, "source": "uploaded_tryon_photos"}
              return {"materials_manifest_json": json.dumps(manifest, ensure_ascii=False, separators=(",", ":"))}
        variables:
        - variable: results
          value_selector:
          - '1795109650007'
          - output
          value_type: array[string]
        - variable: outfit_order
          value_selector:
          - '1795050000000'
          - outfit_order
          value_type: string
        outputs:
          materials_manifest_json:
            type: string
            children: null
