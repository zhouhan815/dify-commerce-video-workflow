    - id: '1795050020000'
      type: custom
      data:
        type: code
        title: 匹配服装和试穿文件
        desc: ''
        code_language: python3
        code: |
          import json

          def main(results: list, garments: list, issues: list) -> dict:
              tryon_images = []
              issues = list(issues or [])
              garments = garments or []
              by_look = {}
              for raw in results or []:
                  try:
                      record = json.loads(raw) if isinstance(raw, str) and raw else {}
                  except ValueError:
                      continue
                  if record.get("look_id"):
                      by_look[record["look_id"]] = record
              for garment in garments:
                  record = by_look.get(garment["look_id"], {})
                  asset = record.get("tryon_image")
                  label = {key: garment[key] for key in ("look_id", "source_photo", "side")}
                  if asset and record.get("look_id") == garment["look_id"]:
                      tryon_images.append({**label, **asset, "status": record.get("status"), "physical_qa": record.get("physical_qa")})
                  else:
                      issues.append({**label, "stage": "试穿", "error": record.get("error", "未取得对应试穿图")})
              return {"tryon_images": tryon_images, "issues": issues}
        variables:
        - variable: results
          value_selector:
          - '1795050014000'
          - output
          value_type: array[string]
        - variable: garments
          value_selector:
          - '1795050012000'
          - garment_images
          value_type: array[object]
        - variable: issues
          value_selector:
          - '1795050012000'
          - issues
          value_type: array[object]
        outputs:
          tryon_images:
            type: array[object]
            children: null
          issues:
            type: array[object]
            children: null
