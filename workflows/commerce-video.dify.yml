    - id: '1795050012000'
      type: custom
      data:
        type: code
        title: 汇总平铺图并配对
        desc: ''
        code_language: python3
        code: |
          import json

          def main(results: list, run_id: str) -> dict:
              galleries, jobs, checks = [], [], []
              for index, body in enumerate(results or [], start=1):
                  try:
                      data = json.loads(body) if isinstance(body, str) and body else {}
                  except ValueError:
                      data = {}
                  looks = data.get("looks") or []
                  if not looks:
                      checks.append({"source_photo": index, "stage": "平铺", "error": data.get("error", "未取得平铺结果")})
                  for look in looks:
                      asset = look.get("garment_image")
                      label = {"look_id": look.get("look_id"), "source_photo": look.get("source_photo"), "side": look.get("side", "")}
                      if asset:
                          galleries.append({**label, **asset, "parts": look.get("parts", {})})
                          jobs.append(json.dumps({"run_id": run_id, "look_id": look["look_id"],
                                                  "notes": look.get("notes", "")}, ensure_ascii=False))
                      else:
                          checks.append({**label, "stage": "平铺", "error": look.get("error", "平铺失败")})
              return {"garment_images": galleries, "tryon_jobs": jobs, "issues": checks}
        variables:
        - variable: results
          value_selector:
          - '1795109650003'
          - output
          value_type: array[string]
        - variable: run_id
          value_selector:
          - '1795050004000'
          - run_id
          value_type: string
        outputs:
          garment_images:
            type: array[object]
            children: null
          tryon_jobs:
            type: array[string]
            children: null
          issues:
            type: array[object]
            children: null
