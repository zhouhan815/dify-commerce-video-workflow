              validate_media_bindings(packet)
              compact = json.dumps(packet, ensure_ascii=False, allow_nan=False, separators=(",", ":"))
              if len(compact) > 200000:
                  raise ValueError("标准化证据包超过 200,000 字符。")
              return {"evidence_json": compact}
