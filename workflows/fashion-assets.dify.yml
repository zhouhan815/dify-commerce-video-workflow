version: 0.7.0
kind: app
app:
  name: 服装白底素材与模特试穿
  description: 上传目标模特和商品穿搭照，逐套生成白底服装与试穿。分别输出模型参考、服装平铺和试穿素材。
  mode: workflow
  icon: 👕
  icon_background: '#E4E9DB'
  icon_type: emoji
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
