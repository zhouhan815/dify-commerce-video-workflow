    - id: '1795050020000'
      type: custom
      data:
        type: code
        title: 匹配服装和试穿文件
        desc: ''
        code_language: python3
        code: "import json\n\ndef main(results: list, garments: list, issues: list) -> dict:\n    tryon_images = []\n    issues\
          \ = list(issues or [])\n    garments = garments or []\n    by_look = {}\n    for raw in results or []:\n       \
          \ try:\n            record = json.loads(raw) if isinstance(raw, str) and raw else {}\n        except ValueError:\n\
          \            continue\n        if record.get(\"look_id\"):\n            by_look[record[\"look_id\"]] = record\n\
          \    for garment in garments:\n        record = by_look.get(garment[\"look_id\"], {})\n        asset = record.get(\"\
          tryon_image\")\n        label = {key: garment[key] for key in (\"look_id\", \"source_photo\", \"side\")}\n     \
          \   if asset and record.get(\"look_id\") == garment[\"look_id\"]:\n            tryon_images.append({**label, **asset})\n\
          \        else:\n            issues.append({**label, \"stage\": \"试穿\", \"error\": record.get(\"error\", \"未取得对应试穿图\"\
          )})\n    return {\"tryon_images\": tryon_images, \"issues\": issues}\n"
        variables:
        - variable: results
          value_selector:
          - '1795050014000'
          - output
          value_type: array[string]
        - variable: garments
          value_selector:
          - '1795050012000'
          - garment_images
          value_type: array[object]
        - variable: issues
          value_selector:
          - '1795050012000'
          - issues
          value_type: array[object]
        outputs:
          tryon_images:
            type: array[object]
            children: null
          issues:
            type: array[object]
            children: null
