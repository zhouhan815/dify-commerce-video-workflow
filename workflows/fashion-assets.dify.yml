    - id: '1795050012000'
      type: custom
      data:
        type: code
        title: 汇总平铺图并配对
        desc: ''
        code_language: python3
        code: "import json\n\ndef main(results: list, run_id: str) -> dict:\n    galleries, jobs, checks = [], [], []\n  \
          \  for index, body in enumerate(results or [], start=1):\n        try:\n            data = json.loads(body) if isinstance(body,\
          \ str) and body else {}\n        except ValueError:\n            data = {}\n        looks = data.get(\"looks\")\
          \ or []\n        if not looks:\n            checks.append({\"source_photo\": index, \"stage\": \"平铺\", \"error\"\
          : data.get(\"error\", \"未取得平铺结果\")})\n        for look in looks:\n            asset = look.get(\"garment_image\"\
          )\n            label = {\"look_id\": look.get(\"look_id\"), \"source_photo\": look.get(\"source_photo\"), \"side\"\
          : look.get(\"side\", \"\")}\n            if asset:\n                galleries.append({**label, **asset, \"parts\"\
          : look.get(\"parts\", {})})\n                jobs.append(json.dumps({\"run_id\": run_id, \"look_id\": look[\"look_id\"\
          ],\n                                        \"notes\": look.get(\"notes\", \"\")}, ensure_ascii=False))\n      \
          \      else:\n                checks.append({**label, \"stage\": \"平铺\", \"error\": look.get(\"error\", \"平铺失败\"\
          )})\n    return {\"garment_images\": galleries, \"tryon_jobs\": jobs, \"issues\": checks}\n"
        variables:
        - variable: results
          value_selector:
          - '1795050006000'
          - output
          value_type: array[string]
        - variable: run_id
          value_selector:
          - '1795050004000'
          - run_id
          value_type: string
        outputs:
          garment_images:
            type: array[object]
            children: null
          tryon_jobs:
            type: array[string]
            children: null
          issues:
            type: array[object]
            children: null
