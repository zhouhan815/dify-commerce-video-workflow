    - id: '1795050000000'
      type: custom
      data:
        type: start
        title: 上传目标模特照和商品照
        desc: ''
        variables:
        - variable: model_photo
          label: 目标模特照片
          type: file
          required: true
          default: ''
          options: []
          max_length: 1
          allowed_file_types:
          - image
          allowed_file_upload_methods:
          - local_file
          allowed_file_extensions:
          - .JPG
          - .JPEG
          - .PNG
          - .WEBP
        - variable: garment_photos
          label: 穿搭照片或服装白底图
          type: file-list
          required: true
          default: ''
          options: []
          max_length: 20
          allowed_file_types:
          - image
          allowed_file_upload_methods:
          - local_file
          allowed_file_extensions:
          - .JPG
          - .JPEG
          - .PNG
          - .WEBP
        - variable: model_mode
          label: 模特处理方式
          type: select
          required: true
          default: 复用已确认模特图
          options:
          - 复用已确认模特图
          - 整理正面全身参考
          max_length: 256
        - variable: garment_mode
          label: 服装处理方式
          type: select
          required: true
          default: 从商品上身照生成白底图
          options:
          - 从商品上身照生成白底图
          - 复用已有白底图
          max_length: 256
        - variable: dual_photos
          label: 双人合照序号（可选，如 2,5）
          type: text-input
          required: false
          default: ''
          options: []
          max_length: 256
        - variable: garment_notes
          label: 服装版型备注（可选，如 1：深咖A字半身裙）
          type: paragraph
          required: false
          default: ''
          options: []
          max_length: 1000
